 try{await db.ref('notifications').push({title,message,type,toRole,toUser,fromUser,data,read:false,createdAt:Date.now()})}catch(e){console.error(e)}
}

 const all=useDbList('notifications');
 return useMemo(()=>toList(all).filter(n=>(n.toUser&&n.toUser===user.id)||(n.toRole&&n.toRole===user.role)||(!n.toUser&&!n.toRole)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),[all,user.id,user.role]);

 try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(1320,c.currentTime+.12);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.45);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.5)}catch(e){}
}

function SetupScreen({onDone}){const[n,setN]=useState(''),[u,setU]=useState(''),[p,setP]=useState(''),[e,setE]=useState(''),[busy,setBusy]=useState(false);const go=async()=>{if(!n||!u||!p)return setE('Semua kolom wajib diisi.');setBusy(true);try{const r=db.ref('users').push();await r.set({name:n,username:u.trim(),passwordHash:await sha256(p),role:'superadmin',active:true,createdAt:Date.now()});await db.ref('config/pricePerBag').set(15000);await db.ref('warehouse/stock').set(0);await db.ref('config/company').set({name:'GlasirEs',address:'',phone:'',logo:'',reportColor:'#1c4a73'});onDone()}catch(x){setE(x.message)}setBusy(false)};return <div className="min-h-screen flex items-center justify-center p-6"><Card className="w-full max-w-md"><h1 className="font-display text-2xl font-bold mb-2">Setup Super Admin</h1><p className="text-sm text-slate-500 mb-5">Buat akun pertama GlasirEs.</p><Field label="Nama"><input className={inputCls} value={n} onChange={e=>setN(e.target.value)}/></Field><Field label="Username"><input className={inputCls} value={u} onChange={e=>setU(e.target.value)}/></Field><Field label="Password"><input type="password" className={inputCls} value={p} onChange={e=>setP(e.target.value)}/></Field>{e&&<p className="text-rose-600 text-sm mb-3">{e}</p>}<Btn tone="accent" className="w-full" onClick={go} disabled={busy}>{busy?'Menyimpan…':'Buat Super Admin'}</Btn></Card></div>}
function LoginScreen({onLogin}){
  const[u,setU]=useState(''),[p,setP]=useState(''),[e,setE]=useState(''),[busy,setB]=useState(false);
  const[recover,setRecover]=useState(false);
  const[ru,setRU]=useState(''),[rp,setRP]=useState('');
  const[rn,setRN]=useState('BIG SUPER ADMIN'),[rbu,setRBU]=useState(''),[rbp,setRBP]=useState('');
  const[re,setRE]=useState(''),[rbusy,setRBusy]=useState(false);

  const go=async()=>{
    setB(true);setE('');
    try{
      const s=await db.ref('users').once('value'),a=toList(s.val()),x=a.find(z=>z.username===u.trim());
      if(!x||x.active===false)throw Error('Username tidak ditemukan atau nonaktif.');
      if(await sha256(p)!==x.passwordHash)throw Error('Password salah.');
      localStorage.setItem('glasires_uid',x.id);
      onLogin({id:x.id,...x});
    }catch(z){setE(z.message)}
    setB(false)
  };

  const recoverBig=async()=>{
    setRBusy(true);setRE('');
    try{
      if(!ru.trim()||!rp||!rbu.trim()||!rbp)throw Error('Semua kolom pemulihan wajib diisi.');
      if(rbp.length<6)throw Error('Password BIG SUPER ADMIN minimal 6 karakter.');
      const s=await db.ref('users').once('value'),a=toList(s.val());
      const su=a.find(z=>z.username===ru.trim()&&z.role==='superadmin'&&z.active!==false);

      if(await sha256(rp)!==su.passwordHash)throw Error('Password SUPER ADMIN salah.');
      if(a.some(z=>z.username===rbu.trim()&&z.role!=='bigsuperadmin'))throw Error('Username BIG baru sudah dipakai user lain.');

      const big=a.find(z=>z.role==='bigsuperadmin');
      const now=Date.now();
      if(big){
        await db.ref('users/'+big.id).update({
          username:rbu.trim(),
          passwordHash:await sha256(rbp),
          name:rn.trim()||big.name||'BIG SUPER ADMIN',
          active:true,
          protected:true,

        </div>
      </Card>}
    </div>
    <div className="login-copyright">Copyright © 2026 | Power by <span className="bait-brand">Syech B@-it</span></div>
  </div>
}

function StockOverview(){const ws=useDbValue('warehouse/stock',0),ds=useDbList('driverStock'),us=toList(useDbList('users')),drivers=us.filter(u=>u.role==='driver'),car=Object.values(ds).reduce((a,b)=>a+(+b||0),0);return <div className="grid md:grid-cols-2 gap-5 mb-6"><Card><div className="text-xs font-mono text-slate-400 mb-3">STOK GUDANG</div><IceGauge label="Sisa es di gudang" value={ws} max={Math.max(ws,car,100)} big/></Card><Card><div className="text-xs font-mono text-slate-400 mb-3">DIBAWA DRIVER</div><IceGauge label="Total sedang dibawa" value={car} max={Math.max(ws,car,100)} big/><div className="mt-4 space-y-2">{drivers.map(d=><div key={d.id} className="flex justify-between text-sm"><span>{d.name}</span><b>{ds[d.username]||0} kantong</b></div>)}</div></Card></div>}

function ApproveRequests({me}){const rs=toList(useDbList('stockRequests')).sort((a,b)=>b.requestedAt-a.requestedAt),[toast,show]=useToast();const act=async(r,status)=>{await db.ref('stockRequests/'+r.id).update({status,approvedBy:me.id,approvedByName:me.name,approvedAt:Date.now()});await notify({title:status==='approved'?'Permintaan stok disetujui':'Permintaan stok ditolak',message:`Permintaan ${r.qtyRequested} kantong dari ${r.driverName} ${status==='approved'?'telah di-ACC.':'ditolak.'}`,type:status,toUser:r.driverId,fromUser:me.id,data:{requestId:r.id}});await createAudit('stock_request_'+status,`${r.driverName} ${r.qtyRequested} kantong`,me);show(status==='approved'?'Permintaan disetujui.':'Permintaan ditolak.',status==='approved'?'ok':'err')};return <div className="fade-in">{toast}<h2 className="font-display font-bold text-xl mb-5">Persetujuan Permintaan Stok</h2><Card><div className="font-semibold mb-4">Menunggu Persetujuan</div><div className="space-y-2">{rs.filter(r=>r.status==='pending').map(r=><div key={r.id} className="flex justify-between items-center p-4 rounded-xl border bg-amber-50"><div><b>{r.driverName}</b><div className="text-xs text-slate-500">{r.qtyRequested} kantong · {waktu(r.requestedAt)}</div></div><div className="flex gap-2"><Btn tone="accent" onClick={()=>act(r,'approved')}>✓ ACC</Btn><Btn tone="danger" onClick={()=>act(r,'rejected')}>Tolak</Btn></div></div>)}{!rs.some(r=>r.status==='pending')&&<div className="text-center text-slate-400 py-6">Tidak ada permintaan.</div>}</div></Card></div>}

function ManageUsers({me,roles,title}){const users=toList(useDbList('users')),[name,setN]=useState(''),[un,setU]=useState(''),[pw,setP]=useState(''),[role,setR]=useState(roles[0]),[toast,show]=useToast();const list=users.filter(u=>roles.includes(u.role));const add=async()=>{if(!name||!un||!pw)return show('Lengkapi data.','err');if(users.some(u=>u.username===un.trim()))return show('Username sudah dipakai.','err');const r=await db.ref('users').push({name,username:un.trim(),passwordHash:await sha256(pw),role,active:true,createdAt:Date.now()});if(role==='driver')await db.ref('driverStock/'+un.trim()).set(0);await notify({title:'User baru ditambahkan',message:`${name} (${ROLES[role]}) telah dibuat oleh ${me.name}`,toRole:'superadmin',fromUser:me.id});show('User berhasil ditambahkan.');setN('');setU('');setP('')};const del=async u=>{if(u.id===me.id)return show('Akun sendiri tidak dapat dihapus.','err');if(!confirm(`Hapus ${u.name}?`))return;await db.ref('users/'+u.id).remove();if(u.role==='driver')await db.ref('driverStock/'+u.username).remove();await createAudit('user_deleted',`Menghapus ${u.name} (${ROLES[u.role]})`,me);show('User dihapus.')};return <div className="fade-in">{toast}<h2 className="font-display font-bold text-xl mb-5">{title}</h2><div className="grid lg:grid-cols-5 gap-5"><Card className="lg:col-span-2"><b className="block mb-4">Tambah Pengguna</b><Field label="Nama"><input className={inputCls} value={name} onChange={e=>setN(e.target.value)}/></Field><Field label="Username"><input className={inputCls} value={un} onChange={e=>setU(e.target.value)}/></Field><Field label="Password"><input type="password" className={inputCls} value={pw} onChange={e=>setP(e.target.value)}/></Field>{roles.length>1&&<Field label="Peran"><select className={inputCls} value={role} onChange={e=>setR(e.target.value)}>{roles.map(r=><option key={r}>{r}</option>)}</select></Field>}<Btn tone="accent" className="w-full" onClick={add}>Tambah Pengguna</Btn></Card><Card className="lg:col-span function GudangHome({me}){const stock=useDbValue('warehouse/stock',0),[q,setQ]=useState(''),[note,setNote]=useState(''),[toast,show]=useToast();const add=async()=>{const n=+q;if(!n||n<1)return show('Jumlah tidak valid.','err');await db.ref('warehouse/stock').transaction(v=>(v||0)+n);await db.ref('warehouse/history').push({type:'masuk',qty:n,by:me.id,byName:me.name,note,timestamp:Date.now()});await notify({title:'Stok gudang bertambah',message:`${me.name} menambahkan ${n} kantong ke gudang.`,toRole:'admin',fromUser:me.id});await notify({title:'Stok gudang bertambah',message:`${me.name} menambahkan ${n} kantong ke gudang.`,toRole:'superadmin',fromUser:me.id});await createAudit('stock_in',`${n} kantong`,me);setQ('');setNote('');show('Stok masuk dicatat.')};return <div>{toast}<h2 className="font-display font-bold text-xl mb-5">Stok Gudang</h2><Card className="mb-5"><IceGauge label="Total sisa di gudang" value={stock} max={Math.max(stock,100)} big/></Card><Card><b>Catat Stok Masuk</b><div className="grid sm:grid-cols-2 gap-3 mt-4"><Field label="Jumlah"><input type="number" className={inputCls} value={q} onChange={e=>setQ(e.target.value)}/></Field><Field label="Catatan"><input className={inputCls} value={note} onChange={e=>setNote(e.target.value)}/></Field></div><Btn tone="accent" onClick={add}>Tambah Stok</Btn></Card></div>}

function GudangRelease({me}){const rs=toList(useDbList('stockRequests')).filter(r=>r.status==='approved'),stock=useDbValue('warehouse/stock',0),[toast,show]=useToast();const release=async r=>{if(r.qtyRequested>stock)return show('Stok gudang tidak cukup.','err');const s=await db.ref('users/'+r.driverId).once('value'),u=s.val();if(!u?.username)return show('Driver tidak ditemukan.','err');await db.ref('warehouse/stock').transaction(v=>(v||0)-r.qtyRequested);await db.ref('driverStock/'+u.username).transaction(v=>(v||0)+r.qtyRequested);await db.ref('stockRequests/'+r.id).update({status:'fulfilled',fulfilledBy:me.id,fulfilledByName:me.name,fulfilledAt:Date.now()});await db.ref('warehouse/history').push({type:'keluar',qty:r.qtyRequested,driverId:r.driverId,driverName:r.driverName,by:me.id,byName:me.name,timestamp:Date.now()});await notify({title:'Stok telah dikeluarkan',message:`${r.qtyRequested} kantong telah diberikan kepada ${r.driverName}.`,toUser:r.driverId,fromUser:me.id});await createAudit('stock_release',`${r.qtyRequested} kantong untuk ${r.driverName}`,me);show('Stok dikeluarkan.')};return <div>{toast}<h2 className="font-display font-bold text-xl mb-5">Keluarkan Stok ke Driver</h2><Card><div className="space-y-2">{rs.map(r=><div key={r.id} className="flex justify-between items-center p-4 border rounded-xl bg-sky-50"><div><b>{r.driverName}</b><div className="text-xs">{r.qtyRequested} kantong · ACC {r.approvedByName}</div></div><Btn tone="accent" onClick={()=>release(r)}>Keluarkan Stok</Btn></div>)}{!rs.length&&<div className="text-center text-slate-400 py-6">Tidak ada stok yang menunggu.</div>}</div></Card></div>}

function DriverHome({me}){const stock=useDbValue('driverStock/'+me.username,0),price=useDbValue('config/pricePerBag',15000),ds=toList(useDbList('deliveries')).filter(d=>d.driverId===me.id).sort((a,b)=>b.timestamp-a.timestamp),[customer,setCustomer]=useState(''),[qty,setQty]=useState(''),[pay,setPay]=useState('cash'),[toast,show]=useToast();const save=async()=>{const q=+qty;if(!customer.trim()||q<1)return show('Lengkapi pelanggan dan jumlah.','err');if(q>stock)return show('Stok tidak cukup.','err');let paymentStatus=pay==='cash'?'paid':'unpaid';const r=await db.ref('deliveries').push({driverId:me.id,driverName:me.name,customerName:customer.trim(),qty:q,pricePerUnit:price,total:q*price,paymentMethod:pay,paymentStatus,timestamp:Date.now()});await db.ref('driverStock/'+me.username).transaction(v=>(v||0)-q);await notify({title:'Pengantaran baru',message:`${me.name} mengantar ${q} kantong ke ${customer.trim()} (${pay.toUpperCase()}).`,toRole:'admin',fromUser:me.id,data:{deliveryId:r.key}});await notify({title:'Pengantaran baru',message:`${me.name} mengantar ${q} kantong ke ${customer.trim()}.`,toRole:'superadmin',fromUser:me.id});await createAudit('delivery',`${customer.trim()} ${q} kantong ${pay}`,me);setCustomer('');setQty('');show('Pengantaran tersimpan.')};return <div>{toast}<h2 className="font-display font-bold text-xl mb-5">Halo, {me.name.split(' ')[0]} 👋</h2><div className="grid md:grid-cols-2 gap-5 mb-5"><Card><IceGauge label="Es yang kamu bawa" value={stock} max={Math.max(stock,50)} big/></Card><Card><div className="text-xs text-slate-400">HARGA SAAT INI</div><div className="text-3xl font-display font-bold">{rupiah(price)}</div><div className="text-sm text-slate-500">per kantong</div></Card></div><Card className="mb-5"><b>Input Pengantaran</b><div className="grid sm:grid-cols-4 gap-3 mt-4"><Field label="Pelanggan / Toko"><input className={inputCls} value={customer} onChange={e=>setCustomer(e.target.value)}/></Field><Field label="Jumlah"><input type="number" class   const nav=[{key:'dashboard',label:'Dashboard',icon:'🛡️'},{key:'users',label:'Kelola Semua User',icon:'👥'},{key:'create',label:'Buat User Baru',icon:'➕'},{key:'reset',label:'RESET DATABASE',icon:'⚠️'}];
  return <div className="min-h-screen flex bg-slate-50">{toast}<aside className="fixed lg:static z-40 inset-y-0 left-0 w-72 bg-gradient-to-b from-slate-950 via-slate-900 to-amber-950 text-white flex flex-col shadow-2xl"><div className="px-5 py-6 border-b border-white/10"><div className="text-xs tracking-[.25em] text-amber-300 font-bold">SYSTEM CONTROL</div><div className="font-display font-extrabold text-xl mt-1">BIG SUPER ADMIN</div><div className="text-xs text-white/50 mt-1">Akses penuh & reset database</div></div><nav className="flex-1 p-3 space-y-2">{nav.map(n=><button key={n.key} onClick={()=>setActive(n.key)} className={'w-full text-left px-4 py-3 rounded-xl text-sm font-semibold '+(active===n.key?'bg-amber-300 text-slate-950':'text-white/80 hover:bg-white/10')}>{n.icon} {n.label}</button>)}</nav><div className="p-4 border-t border-white/10"><div className="text-xs text-white/50">Masuk sebagai</div><div className="font-bold">{me.name}</div><div className="text-xs text-amber-300">{me.username}</div><Btn tone="ghost" className="w-full mt-3 !bg-white/10 !text-white !border-white/10" onClick={logout}>Keluar</Btn></div><footer className="bait-developer-footer"><div className="bait-developer-content"><div className="bait-powered">● Power by</div><div className="bait-name">Syech B@-it</div><div className="bait-copyright">Copyright © 2026</div></div></footer></aside><main className="flex-1 min-w-0"><div className="p-5 lg:p-8 max-w-7xl mx-auto"><div className="mb-6"><div className="text-xs font-mono text-amber-700 tracking-widest">DATABASE CONTROL CENTER</div><h1 className="font-display font-extrabold text-3xl text-slate-900">BIG SUPER ADMIN</h1><p className="text-sm text-slate-500 mt-1">Kelola akun dan kendalikan reset seluruh data aplikasi.</p></div>{active==='dashboard'&&<div className="fade-in"><div className="grid sm:grid-cols-2 lg:grid-cols-5 gap-4">{[['bigsuperadmin','BIG SUPER ADMIN','🛡️'],['superadmin','SUPER ADMIN','👑'],['admin','ADMIN','🧑‍💼'],['driver','DRIVER','🚚'],['gudang','GUDANG','🏔️']].map(([r,l,i])=><Card key={r}><div className="text-3xl">{i}</div><div className="text-xs text-slate-500 mt-3">{l}</div><div className="text-3xl font-display font-bold mt-1">{counts[r]||0}</div></Card>)}</div><Card className="mt-5"><h2 className="font-bold text-lg">Kontrol Sistem</h2><div className="grid md:grid-cols-3 gap-4 mt-4"><div className="p-4 rounded-2xl bg-amber-50 border border-amber-200"><b>👥 Kelola semua user</b><p className="text-sm text-slate-600 mt-1">Lihat dan hapus Super Admin, Admin, Driver, dan Gudang.</p></div><div className="p-4 rounded-2xl bg-sky-50 border border-sky-200"><b>➕ Buat ulang user</b><p className="text-sm text-slate-600 mt-1">Buat user dari awal setelah reset database.</p></div><div className="p-4 rounded-2xl bg-rose-50 border border-rose-200"><b>⚠️ Reset database</b><p className="text-sm text-slate-600 mt-1">Hapus semua data Firebase dan pertahankan BIG SUPER ADMIN.</p></div></div></Card></div>}{active==='users'&&<div className="fade-in"><Card><div className="flex flex-wrap justify-between gap-3 mb-4"><div><b className="text-lg">Semua Pengguna</b><div className="text-xs text-slate-500 mt-1">BIG SUPER ADMIN dilindungi dan tidak dapat dihapus.</div></div><Pill tone="approved">{users.length} akun</Pill></div><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="text-left border-b text-slate-400"><th className="py-3">Nama</th><th>Username</th><th>Peran</th><th>Status</th><th className="text-right">Aksi</th></tr></thead><tbody>{users.sort((a,b)=>(a.role||'').localeCompare(b.role||'')).map(u=><tr key={u.id} className="border-b"><td className="py-3 font-semibold">{u.name}</td><td>@{u.username}</td><td><Pill>{ROLES[u.role]||u.role}</Pill></td><td>{u.active===false?<Pill tone="rejected">Nonaktif</Pill>:<Pill tone="done">Aktif</Pill>}</td><td className="text-right">{u.role==='bigsuperadmin'?<span className="text-xs font-bold text-amber-700">🔒 DILINDUNGI</span>:<Btn tone="danger" className="!py-1.5 !px-3 text-xs" onClick={()=>deleteUser(u)}>Hapus Permanen</Btn>}</td></tr>)}</tbody></table></div></Card></div>}{active==='create'&&<div className="fade-in"><Card className="max-w-3xl"><h2 className="font-display font-bold text-xl mb-1">Buat User Baru</h2><p className="text-sm text-slate-500 mb-5">Bisa membuat SUPER ADMIN, ADMIN, DRIVER atau GUDANG.</p><div className="grid md:grid-cols-2 gap-3"><Field label="Nama"><input className={inputCls} value={name} onChange={e=>setName(e.target.value)} placeholder="Nama pengguna"/></Field><Field label="Username"><input className={inputCls} value={username} onChange={e=>setUsername(e.target.value)} placeholder="username"/></Field><Field label="Password"><input type="password" className={inputCls} value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password"/></Field><Field label="Peran"><select className={inputCls} value={role} onChange={e=>setRole(e.target.value)}><option value="superadmin">SUPER ADMIN</option><option value="admin">ADMIN</option><option value="driver">DRIVER</option><option value="gudang">GUDANG</option></select></Field></div><Btn tone="accent" onClick={addUser}>➕ Buat User</Btn></Card></div>}{active==='reset'&&<div className="fade-in"><Card className="max-w-3xl border-2 border-rose-200"><div className="text-5xl mb-3">⚠️</div><h2 className="font-display font-extrabold text-2xl text-rose-700">RESET SELURUH DATABASE</h2><p className="text-sm text-slate-600 mt-2">Semua data Firebase akan dihapus: transaksi, invoice, pelanggan, stok gudang, stok driver, permintaan, pengembalian, notifikasi, laporan, log, pengaturan perusahaan, dan seluruh akun selain BIG SUPER ADMIN.</p><div className="mt-5 p-4 rounded-2xl bg-rose-50 border border-rose-200"><b className="text-rose-800">Yang dipertahankan:</b><div className="text-sm mt-1">Hanya akun BIG SUPER ADMIN yang sedang login.</div></div><Field label="Ketik RESET SEMUA DATA untuk konfirmasi"><input className={inputCls+' border-rose-300'} value={confirmText} onChange={e=>setConfirmText(e.target.value)} placeholder="RESET SEMUA DATA"/></Field><Btn tone="danger" className="w-full md:w-auto" disabled={confirmText!=='RESET SEMUA DATA'} onClick={resetAll}>🔥 RESET DATABASE SEKARANG</Btn></Card></div>}</div></main></div>
}

function AdminApp({me,isSuper}){const tabs=[{key:'overview',label:'Ringkasan',icon:'📊'},{key:'approve',label:'Persetujuan Stok',icon:'✅'},{key:'deliveries',label:'Pengantaran',icon:'🧊'},{key:'invoiceCustomers',label:'Pelanggan & Penagihan',icon:'🧾'},{key:'reports',label:'Laporan',icon:'📑'},{key:'income',label:'Pendapatan',icon:'💰'},{key:'payments',label:'Invoice',icon:'💳'},{key:'users',label:'Driver & Gudang',icon:'👥'},...(isSuper?[{key:'admins',label:'Kelola Admin',icon:'🛡️'},{key:'settings',label:'Perusahaan & Harga',icon:'⚙️'}]:[])];const[a,setA]=useState('overview');return <Shell user={me} tabs={tabs} active={a} setActive={setA} onLogout={()=>{localStorage.removeItem('glasires_uid');location.reload()}}>{a==='overview'&&<><h2 className="font-display font-bold text-xl mb-5">Ringkasan {isSuper?'Super Admin':'Admin'}</h2><StockOverview/><DeliveriesTable/></>}{a==='approve'&&<ApproveRequests me={me}/>} {a==='deliveries'&&<><StockOverview/><DeliveriesTable/></>}{a==='invoiceCustomers'&&<InvoiceAdmin me={me}/>} {a==='reports'&&<Reports me={me}/>} {a==='income'&&<IncomeReport me={me}/>} {a==='payments'&&<PaymentManager/>}{a==='users'&&<ManageUsers me={me} roles={['driver','gudang']} title="Kelola Driver & Gudang"/>}{a==='admins'&&isSuper&&<ManageUsers me={me} roles={['admin']} title="Kelola Admin"/>}{a==='settings'&&isSuper&&<CompanySettings me={me}/>} {a==='bigadmin'&&isSuper&&<BigSuperAdminCreator me={me}/>}</Shell>}

function DriverApp({me}){const tabs=[{key:'home',label:'Beranda',icon:'🏠'},{key:'request',label:'Minta Stok',icon:'📦'},{key:'invoiceCustomers',label:'Pelanggan Invoice',icon:'🧾'},{key:'collection',label:'Penagihan Saya',icon:'💰'},{key:'return',label:'Kembalikan Sisa',icon:'↩️'},{key:'reports',label:'Laporan Saya',icon:'📑'},{key:'income',label:'Pendapatan',icon:'💵'}], [a,setA]=useState('home');return <Shell user={me} tabs={tabs} active={a} setActive={setA} onLogout={()=>{localStorage.removeItem('glasires_uid');location.reload()}}>{a==='home'&&<DriverHome me={me}/>} {a==='request'&&<DriverRequest me={me}/>} {a==='invoiceCustomers'&&<InvoiceDriver me={me}/>} {a==='collection'&&<InvoiceCollectionDriver me={me}/>} {a==='return'&&<DriverReturn me={me}/>} {a==='reports'&&<Reports me={me}/>} {a==='income'&&<IncomeReport me={me}/>}</Shell>}

function GudangApp({me}){const tabs=[{key:'home',label:'Stok Gudang',icon:'🏔️'},{key:'release',label:'Keluarkan ke Driver',icon:'🚚'},{key:'returns',label:'Terima Kembalian',icon:'↩️'},{key:'reports',label:'Laporan Gudang',icon:'📑'},{key:'income',label:'Pendapatan',icon:'💵'}],[a,setA]=useState('home');return <Shell user={me} tabs={tabs} active={a} setActive={setA} onLogout={()=>{localStorage.removeItem('glasires_uid');location.reload()}}>{a==='home'&&<GudangHome me={me}/>} {a==='release'&&<GudangRelease me={me}/>} {a==='returns'&&<GudangReceive me={me}/>} {a==='reports'&&<Reports me={me}/>} {a==='income'&&<IncomeReport me={me}/>}</Shell>}

function App(){const[loading,setLoading]=useState(true),[has,setHas]=useState(true),[me,setMe]=useState(null);useEffect(()=>{(async()=>{try{const s=await db.ref('users').once('value');setHas(s.exists());const id=localStorage.getItem('glasires_uid');if(s.exists()&&id){const u=await db.ref('users/'+id).once('value');if(u.exists()&&u.val().active!==false)setMe({id,...u.val()});else localStorage.removeItem('glasires_uid')}}catch(e){console.error(e)}setLoading(false)})()},[]);if(loading)return <div className="min-h-screen flex items-center justify-center font-mono text-slate-400">Memuat GlasirEs…</div>;if(!has)return <SetupScreen onDone={()=>location.reload()}/>;if(!me)return <LoginScreen onLogin={setMe}/>;if(me.role==='bigsuperadmin')return <BigSuperAdminApp me={me}/>;if(me.role==='superadmin')return <AdminApp me={me} isSuper/>;if(me.role==='admin')return <AdminApp me={me}/>;if(me.role==='driver')return <DriverApp me={me}/>;if(me.role==='gudang')return <GudangApp me={me}/>;return <div className="p-8">Peran tidak dikenal.</div>}
ReactDOM.createRoot(document.getElementById('root')).render(FIREBASE_INIT_ERROR?<div className="p-8 text-rose-600">Firebase error: {FIREBASE_INIT_ERROR}</div>:<App/>);

// Anti-inspect ringan; tidak mengganggu aplikasi.
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
