function DataRequestReport({me,isSuper=false}){const requests=toList(useDbList('dataRequests')).filter(r=>(r.status==='approved'||r.status==='rejected')&&(isSuper||r.submittedBy===me.id)).sort((a,b)=>((b.approvedAt||b.rejectedAt||0)-(a.approvedAt||a.rejectedAt||0)));const customers=toList(useDbList('invoiceCustomers')).filter(c=>c.approvalStatus==='approved');const cfg=useDbValue('config/company',{});const [period,setPeriod]=useState('month'),[date,setDate]=useState(tanggalLokal());const range=periodRange(period,date);const rows=requests.filter(r=>{const t=r.status==='approved'?(r.approvedAt||0):(r.rejectedAt||0);return t>=range.start&&t<=range.end});const approved=rows.filter(r=>r.status==='approved').length,rejected=rows.filter(r=>r.status==='rejected').length;const detail=r=>{if(r.type==='product_master')return (r.products||[]).map(p=>`${p.name} (harga standar: ${rupiah(p.standardPrice||0)})`).join(' | ');if(r.type==='standard_price_request')return (r.products||[]).map(x=>`${x.name||x.productName||x.productId} (harga: ${rupiah(x.standardPrice||0)})`).join(' | ');if(r.type==='customer_price_request')return (r.items||[]).map(x=>`${x.productName||'-'} / ${x.customerName||customers.find(c=>c.id===x.customerId)?.customerName||'-'}: ${rupiah(x.price||0)}`).join(' | ');return r.title||'Permintaan Data'};return <div className="fade-in"><div className="no-print"><h2 className="font-display font-bold text-xl mb-2">LAPORAN ACC / TOLAK</h2><p className="text-sm text-slate-500 mb-5">Semua permintaan yang sudah diproses. Gunakan filter harian, bulanan, atau tahunan berdasarkan tanggal keputusan.</p><div className="flex flex-wrap items-end justify-between gap-3"><DateRange {...{period,setPeriod,date,setDate}}/><button type="button" onClick={()=>window.print()} className="px-4 py-2.5 rounded-2xl text-sm font-bold border bg-glacier-900 text-white shadow-sm">🖨 CETAK LAPORAN</button></div></div><div className="report-page report-print-area" style={{'--report-color':cfg.reportColor||'#1c4a73'}}><div className="report-head"><div className="report-logo-placeholder">{cfg.logo?<img className="report-logo" src={cfg.logo}/>:<div className="report-logo-fallback">✓</div>}</div><div><div className="report-title text-2xl font-bold">{cfg.name||'GlasirEs'}</div><div className="text-sm">{cfg.address||'Alamat perusahaan belum diatur'}</div>{cfg.phone&&<div className="text-sm">{cfg.phone}</div>}</div></div><div className="mt-5 report-subhead"><div><h1 className="text-2xl font-bold">LAPORAN ACC / TOLAK PERMINTAAN DATA</h1><p className="text-sm mt-1">Periode: {range.a.toLocaleDateString('id-ID')} s/d {range.e.toLocaleDateString('id-ID')}</p></div><div className="text-right text-xs text-slate-500">Dibuat oleh<br/><b>{me.name}</b></div></div><div className="grid grid-cols-3 gap-3 my-5 report-summary"><div className="report-stat"><span>Total Diproses</span><b>{rows.length}</b></div><div className="report-stat report-stat-ok"><span>ACC</span><b>{approved}</b></div><div className="report-stat report-stat-no"><span>Tolak</span><b>{rejected}</b></div></div><div className="overflow-x-auto mt-4"><table className="w-full text-sm report-table"><thead><tr><th>NO</th><th>TANGGAL KEPUTUSAN</th><th>TANGGAL PENGAJUAN</th><th>PENGAJU</th><th>JENIS PERMINTAAN</th><th>DETAIL DATA</th><th>STATUS</th><th>ALASAN PENOLAKAN</th><th>DIPROSES OLEH</th></tr></thead><tbody>{rows.map((r,i)=>{const t=r.status==='approved'?(r.approvedAt||0):(r.rejectedAt||0);return <tr key={r.id}><td>{i+1}</td><td>{waktu(t)}</td><td>{waktu(r.submittedAt)}</td><td>{r.submittedByName||'-'}</td><td>{r.title||r.type||'Permintaan Data'}</td><td>{detail(r)}</td><td><Pill tone={r.status==='approved'?'approved':'rejected'}>{r.status==='approved'?'ACC':'TOLAK'}</Pill></td><td>{r.status==='rejected'?(r.rejectReason||r.rejectNote||'Alasan tidak dicatat'):'-'}</td><td>{r.status==='approved'?(r.approvedByName||'-'):(r.rejectedByName||'-')}</td></tr>})}{!rows.length&&<tr><td colSpan="9" className="py-8 text-center text-slate-400">Belum ada data ACC / TOLAK pada periode ini.</td></tr>}</tbody></table></div><div className="report-footer-note">Laporan ini menampilkan keputusan berdasarkan tanggal ACC/Tolak. Alasan penolakan dicatat dan dikirim kepada Admin terkait.</div><div className="print-signature"><div className="sig-box"><div>Mengetahui,</div><div className="sig-space"></div><div className="sig-line"></div><div className="sig-name">Super Admin</div><div className="sig-role">Penanggung Jawab</div></div><div className="sig-box"><div>Dibuat oleh,</div><div className="sig-space"></div><div className="sig-line"></div><div className="sig-name">{me.name}</div><div className="sig-role">Petugas Laporan</div></div></div></div></div>}
function PriceChangeReport({me,isSuper=false}){const logs=toList(useDbList('priceChangeLogs')).filter(x=>isSuper||x.by===me.id||x.targetAdmin===me.id).sort((a,b)=>(b.at||0)-(a.at||0));const cfg=useDbValue('config/company',{});const [period,setPeriod]=useState('month'),[date,setDate]=useState(tanggalLokal());const range=periodRange(period,date);const rows=logs.filter(x=>(x.at||0)>=range.start&&(x.at||0)<=range.end);return <div className="fade-in"><div className="no-print"><h2 className="font-display font-bold text-xl mb-2">LAPORAN PERUBAHAN PRODUK & HARGA</h2><p className="text-sm text-slate-500 mb-5">Semua perubahan dapat diperiksa harian, bulanan, atau tahunan.</p><div className="flex flex-wrap items-end justify-between gap-3"><DateRange {...{period,setPeriod,date,setDate}}/><button type="button" onClick={()=>window.print()} className="px-4 py-2.5 rounded-2xl text-sm font-bold border bg-glacier-900 text-white shadow-sm">🖨 CETAK LAPORAN</button></div></div><div className="report-page report-print-area" style={{'--report-color':cfg.reportColor||'#1c4a73'}}><div className="report-head"><div className="report-logo-placeholder">{cfg.logo?<img className="report-logo" src={cfg.logo}/>:<div className="report-logo-fallback">✓</div>}</div><div><div className="report-title text-2xl font-bold">{cfg.name||'GlasirEs'}</div><div className="text-sm">{cfg.address||'Alamat perusahaan belum diatur'}</div>{cfg.phone&&<div className="text-sm">{cfg.phone}</div>}</div></div><div className="mt-5 report-subhead"><div><h1 className="text-2xl font-bold">LAPORAN PERUBAHAN PRODUK & HARGA</h1><p className="text-sm mt-1">Periode: {range.a.toLocaleDateString('id-ID')} s/d {range.e.toLocaleDateString('id-ID')}</p></div><div className="text-right text-xs text-slate-500">Dibuat oleh<br/><b>{me.name}</b></div></div><div className="grid grid-cols-2 gap-3 my-5 report-summary"><div className="report-stat"><span>Total Perubahan</span><b>{rows.length}</b></div><div className="report-stat report-stat-ok"><span>Periode</span><b className="text-sm">{period==='day'?'HARIAN':period==='month'?'BULANAN':'TAHUNAN'}</b></div></div><div className="overflow-x-auto mt-4"><table className="w-full text-sm report-table"><thead><tr><th>NO</th><th>TANGGAL</th><th>JENIS PERUBAHAN</th><th>PRODUK</th><th>PELANGGAN</th><th>SEBELUM</th><th>SESUDAH</th><th>DILAKUKAN OLEH</th><th>KETERANGAN</th></tr></thead><tbody>{rows.map((r,i)=><tr key={r.id}><td>{i+1}</td><td>{waktu(r.at)}</td><td>{r.action||'-'}</td><td>{r.productName||'-'}</td><td>{r.customerName||'-'}</td><td>{r.oldPrice==null?'-':rupiah(r.oldPrice)}</td><td>{r.newPrice==null?'-':rupiah(r.newPrice)}</td><td>{r.byName||'-'}</td><td>{r.note||'-'}</td></tr>)}{!rows.length&&<tr><td colSpan="9" className="py-8 text-center text-slate-400">Belum ada perubahan pada periode ini.</td></tr>}</tbody></table></div><div className="report-footer-note">Seluruh perubahan harga dan produk yang tercatat pada periode ini menjadi bagian dari riwayat pengawasan sistem.</div><div className="print-signature"><div className="sig-box"><div>Mengetahui,</div><div className="sig-space"></div><div className="sig-line"></div><div className="sig-name">Super Admin</div><div className="sig-role">Penanggung Jawab</div></div><div className="sig-box"><div>Dibuat oleh,</div><div className="sig-space"></div><div className="sig-line"></div><div className="sig-name">{me.name}</div><div className="sig-role">Petugas Laporan</div></div></div></div></div>}
function AdminCompanyData({me}){const[sub,setSub]=useState('company');const tabs=[['company','INPUT DATA PERUSAHAAN'],['newProduct','NEW PRODUCT'],['offer','PENAWARAN PELANGGAN'],['approvalReport','LAPORAN ACC / TOLAK'],['report','LAPORAN PERUBAHAN']];return <div><div className="flex flex-wrap gap-2 mb-5 print-hide">{tabs.map(x=><button key={x[0]} onClick={()=>setSub(x[0])} className={'px-4 py-2.5 rounded-2xl text-sm font-semibold border '+(sub===x[0]?'bg-glacier-900 text-white':'bg-white text-glacier-700')}>{x[1]}</button>)}</div>{sub==='company'&&<AdminCompanyPrice me={me}/>} {sub==='newProduct'&&<AdminNewProducts me={me}/>} {sub==='offer'&&<AdminCustomerOffer me={me}/>} {sub==='approvalReport'&&<DataRequestReport me={me}/>} {sub==='report'&&<PriceChangeReport me={me}/>}</div>}
function SuperDataRequests({me}){const requests=toList(useDbList('dataRequests')).sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0));const customers=toList(useDbList('invoiceCustomers')).filter(c=>c.approvalStatus==='approved'&&c.status!=='rejected');const products=toList(useDbList('config/products')).filter(p=>p.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||''));const [toast,show]=useToast();
 const approveProduct=async r=>{const list=(r.products||[]).filter(p=>String(p.name||'').trim());if(!list.length)return show('Tidak ada produk yang bisa disetujui.','err');for(const p of list){const ref=db.ref('config/products').push();await ref.set({name:p.name.trim(),standardPrice:0,customerPrices:{},active:true,createdAt:Date.now(),createdBy:me.id,createdByName:me.name});await db.ref('priceChangeLogs').push({action:'TAMBAH PRODUK',productName:p.name.trim(),oldPrice:null,newPrice:0,by:me.id,byName:me.name,at:Date.now(),note:'Jenis produk baru disetujui'});}await db.ref('dataRequests/'+r.id).update({status:'approved',approvedBy:me.id,approvedByName:me.name,approvedAt:Date.now()});await notify({title:'Jenis produk disetujui',message:`Pengajuan jenis produk Anda telah di-ACC dan sekarang tersedia di sistem.`,toUser:r.submittedBy,fromUser:me.id,data:{requestId:r.id},menu:'companyData'});await createAudit('product_master_approved',`Menyetujui jenis produk dari ${r.submittedByName||'Admin'}`,me);show('Jenis produk disetujui dan sudah aktif.');};
 const reject=async r=>{if(!confirm('Tolak permintaan ini?'))return;const reason=prompt('Masukkan alasan penolakan yang akan dikirim kepada Admin:','');if(reason===null)return;if(!String(reason).trim())return show('Alasan penolakan wajib diisi.','err');const now=Date.now();await db.ref('dataRequests/'+r.id).update({status:'rejected',rejectedBy:me.id,rejectedByName:me.name,rejectedAt:now,rejectReason:String(reason).trim(),rejectNote:String(reason).trim()});await notify({title:'Permintaan ditolak',message:`Permintaan ${r.title||'data'} dari Anda ditolak oleh Super Admin. Alasan: ${String(reason).trim()}`,toUser:r.submittedBy,fromUser:me.id,data:{requestId:r.id,rejectionReason:String(reason).trim()},menu:'companyData'});await createAudit('data_request_rejected',`Menolak ${r.title||'permintaan data'} dari ${r.submittedByName||'Admin'}: ${String(reason).trim()}`,me);show('Permintaan ditolak dan alasan sudah dikirim ke Admin.','err');};
 const approveStandard=async r=>{for(const x of r.products||[]){const ref=db.ref('config/products/'+x.productId);const snap=await ref.once('value');const old=snap.val();if(!old)continue;await ref.update({standardPrice:+x.standardPrice||0,updatedAt:Date.now(),updatedBy:me.id,updatedByName:me.name});await db.ref('priceChangeLogs').push({action:'UBAH HARGA STANDAR',productName:old.name,oldPrice:+old.standardPrice||0,newPrice:+x.standardPrice||0,by:me.id,byName:me.name,targetAdmin:r.submittedBy,at:Date.now(),note:'Permintaan Admin disetujui'});}await db.ref('dataRequests/'+r.id).update({status:'approved',approvedBy:me.id,approvedByName:me.name,approvedAt:Date.now()});await notify({title:'Perubahan nilai standar disetujui',message:'Permintaan nilai standar Anda telah disetujui dan harga sudah diperbarui.',toUser:r.submittedBy,fromUser:me.id,data:{requestId:r.id},menu:'companyData'});await createAudit('standard_price_approved',`Menyetujui perubahan nilai standar dari ${r.submittedByName||'Admin'}`,me);show('Nilai standar diperbarui.');};
 const approveCustomer=async r=>{for(const x of r.items||[]){const ref=db.ref('config/products/'+x.productId);const snap=await ref.once('value');const old=snap.val();if(!old)continue;const before=old.customerPrices?.[x.customerId];await ref.update({customerPrices:{...(old.customerPrices||{}),[x.customerId]:+x.price||0},updatedAt:Date.now(),updatedBy:me.id,updatedByName:me.name});await db.ref('priceChangeLogs').push({action:'UBAH HARGA PELANGGAN',productName:old.name,customerName:x.customerName,oldPrice:before==null?null:+before,newPrice:+x.price||0,by:me.id,byName:me.name,targetAdmin:r.submittedBy,at:Date.now(),note:'Penawaran pelanggan disetujui'});}await db.ref('dataRequests/'+r.id).update({status:'approved',approvedBy:me.id,approvedByName:me.name,approvedAt:Date.now()});await notify({title:'Harga pelanggan disetujui',message:'Permintaan harga pelanggan invoice Anda telah disetujui dan harga sudah diperbarui.',toUser:r.submittedBy,fromUser:me.id,data:{requestId:r.id},menu:'companyData'});await createAudit('customer_price_approved',`Menyetujui harga pelanggan dari ${r.submittedByName||'Admin'}`,me);show('Harga pelanggan diperbarui.');};
 const pending=requests.filter(r=>r.status==='pending');return <div>{toast}<h2 className="font-display font-bold text-xl mb-2">PERMINTAAN DATA</h2><p className="text-sm text-slate-500 mb-5">Semua permintaan Admin diperiksa di sini. Super Admin dapat ACC atau Tolak sebelum data aktif.</p><div className="space-y-5">{pending.map(r=><Card key={r.id}><div className="flex flex-wrap justify-between gap-3 mb-4"><div><b>{r.title||'Permintaan Data'}</b><div className="text-xs text-slate-500">Dikirim {r.submittedByName||'-'} · {waktu(r.submittedAt)}</div></div><Pill tone="pending">MENUNGGU ACC</Pill></div>{r.type==='product_master'&&<div className="p-4 rounded-2xl bg-sky-50 border"><b>Jenis Produk Baru</b><div className="mt-2 flex flex-wrap gap-2">{(r.products||[]).map((p,i)=><Pill key={i}>{p.name}</Pill>)}</div></div>}{r.type==='standard_price_request'&&<div className="space-y-2">{(r.products||[]).map(x=>{const p=products.find(y=>y.id===x.productId);return <div key={x.productId} className="p-4 rounded-2xl border"><b>{p?.name||x.name}</b><div className="text-sm mt-1">Nilai standar diajukan: <b>{rupiah(x.standardPrice)}</b> · Saat ini: <b>{rupiah(p?.standardPrice||0)}</b></div></div>})}</div>}{r.type==='customer_price_request'&&<div className="space-y-2">{(r.items||[]).map((x,i)=><div key={i} className="p-4 rounded-2xl border"><b>{x.productName}</b> · {x.customerName}<div className="text-sm mt-1">Harga diajukan: <b>{rupiah(x.price)}</b></div></div>)}</div>}<div className="flex flex-wrap gap-2 mt-5 pt-4 border-t"><Btn tone="accent" onClick={()=>r.type==='product_master'?approveProduct(r):r.type==='standard_price_request'?approveStandard(r):approveCustomer(r)}>✓ ACC & AKTIFKAN</Btn><Btn tone="danger" onClick={()=>reject(r)}>Tolak</Btn></div></Card>)}{!pending.length&&<Card><div className="text-center text-slate-400 py-8">Tidak ada permintaan yang menunggu ACC.</div></Card>}</div></div>}
function SuperProductManager({me}){const products=toList(useDbList('config/products')).filter(p=>p.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||''));const customers=toList(useDbList('invoiceCustomers')).filter(c=>c.approvalStatus==='approved'&&c.status!=='rejected');const [edit,setEdit]=useState({}),[toast,show]=useToast();const save=async p=>{const x=edit[p.id]||{};const name=String(x.name??p.name).trim();if(!name)return show('Nama produk wajib diisi.','err');const oldName=p.name;await db.ref('config/products/'+p.id).update({name,updatedAt:Date.now(),updatedBy:me.id,updatedByName:me.name});if(name!==oldName){await db.ref('priceChangeLogs').push({action:'UBAH NAMA PRODUK',productName:name,by:me.id,byName:me.name,at:Date.now(),note:`Nama sebelumnya: ${oldName}`});await notify({title:'Nama produk diubah',message:`Jenis produk ${oldName} diubah menjadi ${name} oleh Super Admin.`,toRole:'admin',fromUser:me.id,menu:'companyData'});}setEdit(e=>{const z={...e};delete z[p.id];return z});show('Nama produk diperbarui.');};const del=async p=>{if(!confirm(`Hapus jenis produk ${p.name}? Produk tidak akan tampil lagi untuk input baru.`))return;await db.ref('config/products/'+p.id).update({active:false,deletedAt:Date.now(),deletedBy:me.id,deletedByName:me.name});await db.ref('priceChangeLogs').push({action:'HAPUS PRODUK',productName:p.name,by:me.id,byName:me.name,at:Date.now(),note:'Dinonaktifkan oleh Super Admin'});await notify({title:'Jenis produk dihapus',message:`Jenis produk ${p.name} telah dinonaktifkan oleh Super Admin.`,toRole:'admin',fromUser:me.id,menu:'companyData'});show('Jenis produk berhasil dihapus.');};const updatePrice=async(p,cid,val)=>{const n=+val;if(!Number.isFinite(n)||n<0)return;const old=p.customerPrices?.[cid];await db.ref('config/products/'+p.id).update({customerPrices:{...(p.customerPrices||{}),[cid]:n},updatedAt:Date.now(),updatedBy:me.id,updatedByName:me.name});const c=customers.find(x=>x.id===cid);await db.ref('priceChangeLogs').push({action:'UBAH HARGA PELANGGAN',productName:p.name,customerName:c?.customerName||cid,oldPrice:old==null?null:+old,newPrice:n,by:me.id,byName:me.name,targetAdmin:null,at:Date.now(),note:'Diubah langsung oleh Super Admin'});await notify({title:'Harga pelanggan berubah',message:`Harga ${p.name} untuk ${c?.customerName||'pelanggan'} telah diperbarui oleh Super Admin.`,toRole:'admin',fromUser:me.id,menu:'companyData'});show('Harga pelanggan diperbarui.');};const updateStandard=async(p,val)=>{const n=+val;if(!Number.isFinite(n)||n<0)return;const old=+p.standardPrice||0;await db.ref('config/products/'+p.id).update({standardPrice:n,updatedAt:Date.now(),updatedBy:me.id,updatedByName:me.name});await db.ref('priceChangeLogs').push({action:'UBAH HARGA STANDAR',productName:p.name,oldPrice:old,newPrice:n,by:me.id,byName:me.name,at:Date.now(),note:'Diubah langsung oleh Super Admin'});await notify({title:'Harga standar berubah',message:`Nilai standar ${p.name} telah diperbarui oleh Super Admin.`,toRole:'admin',fromUser:me.id,menu:'companyData'});show('Harga standar diperbarui.');};return <div>{toast}<h2 className="font-display font-bold text-xl mb-2">PRODUK & HARGA AKTIF</h2><p className="text-sm text-slate-500 mb-5">Super Admin dapat mengubah nama, menghapus produk, dan memperbarui harga secara langsung. Semua perubahan masuk laporan dan notifikasi.</p><div className="space-y-4">{products.map(p=><Card key={p.id}><div className="flex flex-wrap items-end gap-2"><div className="flex-1 min-w-[220px]"><Field label="Jenis Produk"><input className={inputCls} value={edit[p.id]?.name??p.name} onChange={e=>setEdit(v=>({...v,[p.id]:{...v[p.id],name:e.target.value}}))}/></Field></div><Btn tone="accent" onClick={()=>save(p)}>Simpan Nama</Btn><Btn tone="danger" onClick={()=>del(p)}>Hapus Produk</Btn></div><div className="grid md:grid-cols-2 gap-4 mt-4"><Field label="Harga Standar"><input type="number" className={inputCls} defaultValue={p.standardPrice||0} onBlur={e=>updateStandard(p,e.target.value)}/></Field><div><div className="text-xs font-semibold text-glacier-600 mb-2">Harga Pelanggan Invoice</div><div className="space-y-2">{customers.map(c=><div key={c.id} className="grid grid-cols-[1fr_160px] gap-2 items-center"><span className="text-sm">{c.customerName}</span><input type="number" className={inputCls} defaultValue={p.customerPrices?.[c.id]??''} placeholder="Belum diatur" onBlur={e=>e.target.value!==''&&updatePrice(p,c.id,e.target.value)}/></div>)}{!customers.length&&<div className="text-xs text-slate-400">Belum ada pelanggan invoice yang ACC.</div>}</div></div></div></Card>)}{!products.length&&<Card><div className="text-center text-slate-400 py-8">Belum ada jenis produk aktif.</div></Card>}</div></div>}

function playBell(){
 try{
   const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
   const c=new A(),now=c.currentTime;
   [880,1108.73,1318.51].forEach((freq,i)=>{
     const t=now+i*0.09,o=c.createOscillator(),g=c.createGain();
     o.type='sine';o.frequency.setValueAtTime(freq,t);
     g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.42,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.55);
     o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.6)
   });
   const o2=c.createOscillator(),g2=c.createGain();
   o2.type='triangle';o2.frequency.setValueAtTime(440,now);
   g2.gain.setValueAtTime(.0001,now);g2.gain.exponentialRampToValueAtTime(.32,now+.02);g2.gain.exponentialRampToValueAtTime(.0001,now+.4);
   o2.connect(g2);g2.connect(c.destination);o2.start(now);o2.stop(now+.45)
 }catch(e){}
}

function DriverHome({me}){
  const stockByProduct=useDbList('driverStockByProduct/'+me.id),
        legacyStock=useDbValue('driverStock/'+me.username,0),
        oldPrice=useDbValue('config/pricePerBag',15000),
        products=toList(useDbList('config/products')).filter(p=>p.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||'')),
        invoiceCustomers=toList(useDbList('invoiceCustomers')).filter(b=>b.approvalStatus==='approved'&&b.status!=='rejected').sort((a,b)=>(a.customerName||'').localeCompare(b.customerName||'')),
        ds=toList(useDbList('deliveries')).filter(d=>d.driverId===me.id).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)),
        [productId,setProductId]=useState(''),
        [customer,setCustomer]=useState(''),
        [invoiceId,setInvoiceId]=useState(''),
        [location,setLocation]=useState(''),
        [qty,setQty]=useState(''),
        [pay,setPay]=useState('cash'),
        [saving,setSaving]=useState(false),
        [period,setPeriod]=useState('all'),[periodDate,setPeriodDate]=useState(tanggalLokal()),
        [toast,show]=useToast();
  // Ref dipakai sebagai sumber nilai terakhir input lokasi.
  // Ini mencegah validasi membaca state lama saat tombol Simpan ditekan.
  const locationRef=React.useRef('');
  const customerRef=React.useRef('');
  const customerInputRef=React.useRef(null);
  const locationInputRef=React.useRef(null);

  const setLocationSafe=(value)=>{
    locationRef.current=value;
    setLocation(value);
  };
  const setCustomerSafe=(value)=>{
    customerRef.current=value;
    setCustomer(value);
  };

  const selectedProduct=products.find(p=>p.id===productId);
  const selectedInvoice=invoiceCustomers.find(b=>b.id===invoiceId);

  const invoiceCustomerPrice=selectedProduct&&selectedInvoice&&selectedProduct.customerPrices
    ? selectedProduct.customerPrices[selectedInvoice.id]
    : undefined;

  const price=pay==='invoice'&&invoiceCustomerPrice!==undefined
    ? (+invoiceCustomerPrice||0)
    : (selectedProduct?(+selectedProduct.standardPrice||0):oldPrice);

  const resetForm=()=>{
    setCustomer('');
    customerRef.current='';
    setInvoiceId('');
    setLocation('');
    locationRef.current='';
    if(locationInputRef.current) locationInputRef.current.value='';
    if(customerInputRef.current) customerInputRef.current.value='';
    setQty('');
    setProductId('');
    setPay('cash');
  };

  const save=async()=>{
    if(saving)return;

    // Ambil nilai langsung dari ref + state. Ref menjadi sumber utama
    // sehingga lokasi yang baru saja diketik tidak dianggap kosong.
    // Ambil nilai TERAKHIR langsung dari elemen input.
    // Tidak memakai substring/slice dan tidak pernah mengambil hanya kata pertama.
    const latestCustomer = pay==='invoice'
      ? String(selectedInvoice?.customerName || '')
      : String(customerInputRef.current?.value ?? customerRef.current ?? customer ?? '');
    const latestLocation = String(locationInputRef.current?.value ?? locationRef.current ?? location ?? '');

    // Hanya trim spasi di ujung. Isi di tengah dipertahankan utuh.
    const cleanCustomer=driverFullText(latestCustomer);
    const cleanLocation=driverFullText(latestLocation);
    const q=Number(qty);

    if(products.length && !selectedProduct)return show('Jenis produk wajib dipilih.','err');
    if(!Number.isInteger(q)||q<1)return show('Jumlah kantong wajib diisi minimal 1 kantong.','err');
    const productStock=selectedProduct?Number(stockByProduct[selectedProduct.id]||0):Number(legacyStock||0);
    if(q>productStock)return show(`Stok ${selectedProduct?.name||'produk'} tidak cukup. Stok Anda saat ini ${Math.floor(productStock)} kantong.`,'err');
    // Lokasi pelanggan bersifat OPSIONAL.
    // Jika dikosongkan, transaksi tetap boleh disimpan dan masuk laporan.

    let customerName=cleanCustomer;
    let invoiceCustomerId=null;
    let invoiceNo=null;
    let invoicePaymentStatus=null;

    if(pay==='invoice'){
      if(!selectedInvoice)return show('Pilih pelanggan invoice terlebih dahulu.','err');
      if(!selectedProduct)return show('Pilih jenis produk terlebih dahulu.','err');
      if(invoiceCustomerPrice===undefined)return show('Harga penawaran untuk pelanggan invoice ini belum diatur.','err');
      if((+invoiceCustomerPrice||0)<=0)return show('Harga invoice pelanggan belum tersedia.','err');

      customerName=String(selectedInvoice.customerName||'').trim();
      invoiceCustomerId=selectedInvoice.id;
      invoiceNo=selectedInvoice.invoiceNo||null;
      invoicePaymentStatus='unpaid';

      if(!customerName)return show('Nama pelanggan invoice tidak valid.','err');
    }else{
      if(!customerName)return show('Nama pelanggan / toko wajib diisi.','err');
    }

    if(price<=0)return show('Harga produk belum tersedia.','err');

    const paymentStatus=pay==='cash'?'paid':'unpaid';
    const now=Date.now();
    const deliveryRef=db.ref('deliveries').push();
    const deliveryId=deliveryRef.key;

    setSaving(true);
    let stockTaken=false;
    let stockRef=selectedProduct?db.ref('driverStockByProduct/'+me.id+'/'+selectedProduct.id):db.ref('driverStock/'+me.username);

    try{
      // Kurangi stok secara aman. Transaction mencegah dua penyimpanan
      // bersamaan membuat stok driver menjadi minus.
      const stockResult=await stockRef.transaction(current=>{
        const currentStock=Number(current||0);
        if(currentStock<q)return;
        return currentStock-q;
      });

      if(!stockResult.committed){
        throw new Error('Stok driver berubah atau tidak mencukupi. Silakan periksa stok lalu coba lagi.');
      }
      stockTaken=true;

      const deliveryData={
        driverId:me.id,
        driverName:me.name,
        // Simpan teks lengkap persis sebagai satu nilai string.
        customerName:cleanCustomer,
        customerNameFull:cleanCustomer,
        location:cleanLocation,
        locationFull:cleanLocation,
        qty:q,
        productId:selectedProduct?.id||null,
        productName:selectedProduct?.name||'Es Kristal',
        pricePerUnit:price,
        total:q*price,
        paymentMethod:pay,
        paymentStatus,
        timestamp:now,
        createdAt:now,
        ...(pay==='invoice'
          ? {
              invoiceCustomerId,
              invoiceNo,
              invoiceCustomerName:cleanCustomer||customerName,
              invoiceStatusAtDelivery:invoicePaymentStatus
            }
          : {}),
        ...(pay==='wait_cash'
          ? {waitCashStatus:'pending'}
          : {})

      // Simpan transaksi pengantaran terlebih dahulu.
      await deliveryRef.set(deliveryData);

        if(!bill){
          await deliveryRef.remove();
          throw new Error('Data pelanggan invoice tidak ditemukan.');
        }

        const nextQty=(+bill.qty||0)+q;
        const nextTotal=(+bill.total||0)+(q*price);
        const nextStatus=bill.status==='paid'?'unpaid':(bill.status||'unpaid');

        const resetAssignment=bill.status==='paid'
          ? {
              collectorId:null,
              collectorName:null,
              assignedAt:null,
              assignedBy:null,
              assignedByName:null
            }
          : {};

        await ref.update({
          qty:nextQty,
          total:nextTotal,
          pricePerUnit:price,
          status:nextStatus,
          lastDeliveryAt:now,
          lastDeliveryBy:me.id,
          lastDeliveryByName:me.name,
          lastDeliveryQty:q,
          lastDeliveryTotal:q*price,
          lastDeliveryLocation:cleanLocation,
          lastDeliveryId:deliveryId,
          ...resetAssignment
        });
      }

      const label=pay==='wait_cash'?'WAIT CASH':pay==='invoice'?'INVOICE':'CASH';

        title:'Pengantaran berhasil disimpan',

   if(period==='day'){a.setHours(0,0,0,0);b.setHours(23,59,59,999)}
   else if(period==='month'){a=new Date(base.getFullYear(),base.getMonth(),1);b=new Date(base.getFullYear(),base.getMonth()+1,0,23,59,59,999)}
   else {a=new Date(base.getFullYear(),0,1);b=new Date(base.getFullYear(),11,31,23,59,59,999)}
   return {start:a.getTime(),end:b.getTime(),a,b}
 },[period,date]);

 const inRange=x=>{const t=+x||0;return t>=range.start&&t<=range.end};
 const rows=ds.filter(d=>inRange(d.timestamp)&&(!driverId||d.driverId===driverId));
 const warehouse=wh.filter(x=>inRange(x.timestamp));
 const returns=rr.filter(x=>inRange(x.requestedAt||x.receivedAt));

 const revenue=rows.reduce((a,d)=>a+(+d.total||0),0);
 const cash=rows.filter(d=>d.paymentMethod==='cash').reduce((a,d)=>a+(+d.total||0),0);
 const invoice=rows.filter(d=>d.paymentMethod==='invoice').reduce((a,d)=>a+(+d.total||0),0);
 const waitCash=rows.filter(d=>d.paymentMethod==='wait_cash').reduce((a,d)=>a+(+d.total||0),0);
 const waitCashPaid=rows.filter(d=>d.paymentMethod==='wait_cash'&&d.paymentStatus==='paid').reduce((a,d)=>a+(+d.total||0),0);
 const paid=rows.filter(d=>(d.paymentMethod==='invoice'||d.paymentMethod==='wait_cash')&&d.paymentStatus==='paid').reduce((a,d)=>a+(+d.total||0),0);
 const unpaid=Math.max(0,invoice+waitCash-paid);
 const qty=rows.reduce((a,d)=>a+(+d.qty||0),0);
 const masuk=warehouse.filter(x=>x.type==='masuk').reduce((a,x)=>a+(+x.qty||0),0);
 const keluar=warehouse.filter(x=>x.type==='keluar').reduce((a,x)=>a+(+x.qty||0),0);
 const kembali=returns.filter(x=>x.status==='received'||x.status==='approved').reduce((a,x)=>a+(+x.qty||0),0);
 const currentStock=useDbValue('warehouse/stock',0);

 const drivers=us.filter(u=>u.role==='driver'&&u.active!==false);
 const driverStats=drivers.map(u=>{
   const r=rows.filter(d=>d.driverId===u.id);
   const q=r.reduce((a,d)=>a+(+d.qty||0),0);
   const val=r.reduce((a,d)=>a+(+d.total||0),0);
   const p=r.filter(d=>d.paymentStatus==='paid'||d.paymentMethod==='cash').reduce((a,d)=>a+(+d.total||0),0);
   return {u,count:r.length,qty:q,value:val,paid:p,unpaid:Math.max(0,val-p)};
 }).sort((a,b)=>b.value-a.value);

 const maxDriver=Math.max(1,...driverStats.map(x=>x.value));
 const pct=(v,total)=>total?Math.round(v/total*100):0;
 const periodLabel=period==='day'?'HARIAN':period==='month'?'BULANAN':'TAHUNAN';
 const money=n=>rupiah(n||0);

 const print=()=>window.print();

 const exportPdf=()=>{
   try{
     const {jsPDF}=window.jspdf;
     const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
     const title=report==='revenue'?'LAPORAN PENDAPATAN':report==='warehouse'?'LAPORAN GUDANG':'LAPORAN KINERJA DRIVER';
     pdf.setFont('helvetica','bold');pdf.setFontSize(17);pdf.text(cfg.name||'GlasirEs',15,16);
     pdf.setFont('helvetica','normal');pdf.setFontSize(9);
     pdf.text(cfg.address||'',15,22);pdf.text(cfg.phone||'',15,27);
     pdf.setFont('helvetica','bold');pdf.setFontSize(13);pdf.text(title,15,38);
     pdf.setFont('helvetica','normal');pdf.setFontSize(9);
     pdf.text(`Periode ${periodLabel}: ${range.a.toLocaleDateString('id-ID')} s/d ${range.b.toLocaleDateString('id-ID')}`,15,44);
     let y=54;
     if(report==='revenue'){
       pdf.text(`Pendapatan: ${money(revenue)}`,15,y);y+=6;
       pdf.text(`CASH: ${money(cash)} (${pct(cash,revenue)}%)`,15,y);y+=6;
       pdf.text(`INVOICE: ${money(invoice)} (${pct(invoice,revenue)}%)`,15,y);y+=6;
        pdf.text(`WAIT CASH: ${money(waitCash)} | BELUM LUNAS: ${money(Math.max(0,waitCash-waitCashPaid))}`,15,y);y+=6;
       pdf.text(`LUNAS: ${money(paid)} (${pct(paid,invoice)}% dari invoice)`,15,y);y+=6;
       pdf.text(`BELUM LUNAS: ${money(unpaid)} (${pct(unpaid,invoice)}% dari invoice)`,15,y);y+=9;
       pdf.text(`Transaksi: ${rows.length} | Kantong: ${qty}`,15,y);y+=7;pdf.setFillColor(14,165,233);pdf.rect(15,y,70*(revenue?cash/revenue:0),5,'F');pdf.setFillColor(34,197,94);pdf.rect(15+70*(revenue?cash/revenue:0),y,70*(revenue?invoice/revenue:0),5,'F');y+=9;pdf.text(`Diagram CASH ${pct(cash,revenue)}% · INVOICE ${pct(invoice,revenue)}%`,15,y);y+=7;
     }else if(report==='warehouse'){
       pdf.text(`Stok saat ini: ${currentStock} kantong`,15,y);y+=6;
       pdf.text(`Masuk: ${masuk} kantong`,15,y);y+=6;
       pdf.text(`Keluar: ${keluar} kantong`,15,y);y+=6;
       pdf.text(`Kembali diterima: ${kembali} kantong`,15,y);y+=7;const wt=masuk+keluar+kembali||1;pdf.setFillColor(34,197,94);pdf.rect(15,y,70*masuk/wt,5,'F');pdf.setFillColor(239,68,68);pdf.rect(15+70*masuk/wt,y,70*keluar/wt,5,'F');pdf.setFillColor(139,92,246);pdf.rect(15+70*(masuk+keluar)/wt,y,70*kembali/wt,5,'F');y+=7;pdf.text(`Diagram arus: Masuk ${pct(masuk,wt)}% · Keluar ${pct(keluar,wt)}% · Kembali ${pct(kembali,wt)}%`,15,y);y+=9;
     }else{
       pdf.text(`Total driver aktif: ${driverStats.length}`,15,y);y+=7;driverStats.slice(0,10).forEach((d,i)=>{const w=60*(maxDriver?d.value/maxDriver:0);pdf.setFillColor(14,165,233);pdf.rect(15,y,w,4,'F');pdf.setFontSize(7);pdf.setTextColor(30,41,59);pdf.text(`${d.u.name} ${pct(d.value,revenue)}%`,78,y+3);y+=6});pdf.setTextColor(0,0,0);y+=4;
     }
     pdf.setFont('helvetica','bold');pdf.text('RINGKASAN',15,y);y+=6;
     pdf.setFont('helvetica','normal');pdf.setFontSize(8);
     if(report==='driver'){
       driverStats.slice(0,22).forEach((d,i)=>{
         pdf.text(`${i+1}. ${d.u.name} | ${d.count} trx | ${d.qty} kantong | ${money(d.value)} | ${pct(d.value,revenue)}%`,15,y);
         y+=5;if(y>282){pdf.addPage();y=18}
       });
     }else if(report==='warehouse'){
       warehouse.slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).slice(0,32).forEach((x,i)=>{
         pdf.text(`${i+1}. ${new Date(x.timestamp).toLocaleDateString('id-ID')} | ${x.type.toUpperCase()} | ${x.qty} | ${x.byName||x.driverName||'-'}`,15,y);
         y+=5;if(y>282){pdf.addPage();y=18}
       });
     }else{
       rows.slice().sort((a,b)=>b.timestamp-a.timestamp).slice(0,30).forEach((d,i)=>{
         pdf.text(`${i+1}. ${new Date(d.timestamp).toLocaleDateString('id-ID')} | ${d.driverName} | ${d.customerName} | ${d.qty} | ${money(d.total)}`,15,y);
         y+=5;if(y>282){pdf.addPage();y=18}
       });
     }
     pdf.save(`glasires-${report}-${period}.pdf`);
   }catch(e){show('PDF gagal: '+e.message,'err')}
 };

 const sendReport=async()=>{
   if(!selectedUsers.length)return show('Pilih minimal satu user penerima.','err');
   const title=report==='revenue'?'Laporan Pendapatan':report==='warehouse'?'Laporan Gudang':'Laporan Kinerja Driver';
   const message=report==='revenue'
     ? `${title} ${periodLabel}: ${money(revenue)} | CASH ${money(cash)} | INVOICE ${money(invoice)} | LUNAS ${money(paid)} | WAIT CASH ${money(waitCash)} | WAIT CASH BELUM ${money(Math.max(0,waitCash-waitCashPaid))} | BELUM ${money(unpaid)}.`
     : report==='warehouse'
     ? `${title} ${periodLabel}: Stok ${currentStock} kantong | Masuk ${masuk} | Keluar ${keluar} | Kembali ${kembali}.`
     : `${title} ${periodLabel}: ${driverStats.length} driver | ${qty} kantong | ${money(revenue)}.`;
   for(const uid of selectedUsers){
     await notify({title,message,type:'report',toUser:uid,fromUser:me.id,data:{
       report,period,periodStart:range.start,periodEnd:range.end,
       revenue,cash,invoice,paid,unpaid,qty,masuk,keluar,kembali,currentStock,
       driverCount:driverStats.length
     },menu:'reports'});
   }
   show(`Laporan berhasil dikirim ke ${selectedUsers.length} user.`);
 };

 const toggleUser=id=>setSelectedUsers(v=>v.includes(id)?v.filter(x=>x!==id):[...v,id]);
 const doughnut=(a,b,c)=>{
   const total=(+a||0)+(+b||0)+(+c||0)||1,pa=(+a||0)/total*100,pb=((+a||0)+(+b||0))/total*100;
   return {background:`conic-gradient(#0ea5e9 0 ${pa}%, #22c55e ${pa}% ${pb}%, #f59e0b ${pb}% 100%)`};
 };

    setProductId('');setQ('');show('Permintaan dikirim ke Admin. Status: MENUNGGU ACC ADMIN.');
  };
  const statusLabel=r=>r.status==='pending'?'MENUNGGU ACC ADMIN':r.status==='admin_approved'?'SUDAH DI-ACC ADMIN · MENUNGGU GUDANG':r.status==='fulfilled'?'APPROVE ADMIN + GUDANG · SELESAI':r.status==='rejected'?'DITOLAK':'SELESAI';
  return <div>{toast}<h2 className="font-display font-bold text-xl mb-5">Minta Stok Es</h2>
    <Card className="mb-5"><div className="grid sm:grid-cols-3 gap-3"><Field label="Jenis Produk"><select className={inputCls} value={productId} onChange={e=>setProductId(e.target.value)}><option value="">Pilih jenis produk</option>{products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></Field><Field label="Tanggal Dibutuhkan"><input type="date" min={tanggalLokal()} className={inputCls} value={neededDate} onChange={e=>setNeededDate(e.target.value)}/></Field><Field label="Jumlah Kantong"><input type="number" min="1" className={inputCls} value={q} onChange={e=>setQ(e.target.value)}/></Field></div><Btn tone="accent" onClick={send}>Kirim Permintaan</Btn></Card>
    <Card><b>Riwayat Permintaan</b><DriverHistoryFilter period={period} setPeriod={setPeriod} date={periodDate} setDate={setPeriodDate}/><div className="mt-4 space-y-2">{filteredRs.map(r=><div key={r.id} className="p-4 rounded-xl border"><div className="flex justify-between gap-3"><span><b>{r.productName||'Es Kristal'} · {r.qtyRequested} kantong</b><br/><small>Dibutuhkan: {r.requestedForDate?new Date(r.requestedForDate+'T00:00:00').toLocaleDateString('id-ID'):'-'}</small><br/><small>Diminta: {waktu(r.requestedAt)}</small></span><Pill tone={r.status==='pending'?'pending':r.status==='rejected'?'rejected':r.status==='fulfilled'?'done':'approved'}>{statusLabel(r)}</Pill></div>{r.status==='admin_approved'&&<div className="text-xs text-amber-700 mt-2">✓ Sudah di-ACC Admin · menunggu pengeluaran / APPROVE Gudang.</div>}{r.status==='fulfilled'&&<div className="text-xs text-emerald-700 mt-2">✓ Admin ACC {waktu(r.approvedAt)} · Gudang APPROVE {waktu(r.fulfilledAt)}.</div>}{r.status==='rejected'&&<div className="text-xs text-rose-700 mt-2">{r.rejectReason||'Permintaan ditolak.'}</div>}</div>)}{!filteredRs.length&&<div className="text-center text-slate-400 py-6">Belum ada permintaan pada periode ini.</div>}</div></Card>
  </div>
}

function DriverReturn({me}){
  const products=toList(useDbList('config/products')).filter(p=>p.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||'')),
        driverByProduct=useDbList('driverStockByProduct/'+me.id),
        legacyStock=useDbValue('driverStock/'+me.username,0),
        rs=toList(useDbList('returnRequests')).filter(r=>r.driverId===me.id).sort((a,b)=>(b.requestedAt||0)-(a.requestedAt||0)),
        [productId,setProductId]=useState(''),[q,setQ]=useState(''),[period,setPeriod]=useState('month'),[date,setDate]=useState(tanggalLokal()),[toast,show]=useToast();
  const selectedStock=productId?Number(driverByProduct[productId]||0):0;
  const send=async()=>{
    const n=+q,product=products.find(p=>p.id===productId);
    if(!product)return show('Pilih jenis produk terlebih dahulu.','err');
    if(n<1||n>selectedStock)return show(`Jumlah tidak valid. Stok ${product.name} Anda ${selectedStock} kantong.`,'err');
    const r=await db.ref('returnRequests').push({driverId:me.id,driverName:me.name,productId,productName:product.name,qty:n,status:'pending',requestedAt:Date.now()});
    await notify({title:'Pengembalian stok',message:`${me.name} mengirim pengembalian ${n} kantong ${product.name}. Status: MENUNGGU ACC GUDANG.`,toRole:'gudang',fromUser:me.id,data:{returnId:r.key,productId},menu:'returns'});
    setQ('');setProductId('');show('Pengembalian dikirim ke Gudang. Menunggu ACC Gudang.');
  };
  const start=new Date(date+'T00:00:00');let end=new Date(start);
  if(period==='day'){start.setHours(0,0,0,0);end.setHours(23,59,59,999)}
  else if(period==='month'){start.setDate(1);start.setHours(0,0,0,0);end=new Date(start.getFullYear(),start.getMonth()+1,0,23,59,59,999)}
  else {start.setMonth(0,0);start.setHours(0,0,0,0);end=new Date(start.getFullYear(),11,31,23,59,59,999)}
  const history=rs.filter(r=>(r.requestedAt||r.receivedAt||0)>=start.getTime()&&(r.requestedAt||r.receivedAt||0)<=end.getTime());
  return <div>{toast}<h2 className="font-display font-bold text-xl mb-5">KEMBALIKAN SISA ES</h2>
    <Card className="mb-5"><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3"><div><small>DRIVER</small><b className="block">{me.name}</b></div><div><small>STOK LAMA</small><b className="block">{legacyStock} KANTONG</b></div><div><small>PRODUK DIPILIH</small><b className="block">{products.find(p=>p.id===productId)?.name||'-'}</b></div><div><small>STOK PRODUK</small><b className="block">{selectedStock} KANTONG</b></div></div></Card>
    <Card className="mb-5"><div className="grid md:grid-cols-2 gap-3"><Field label="Jenis Produk"><select className={inputCls} value={productId} onChange={e=>setProductId(e.target.value)}><option value="">Pilih jenis produk</option>{products.map(p=><option key={p.id} value={p.id}>{p.name} — {Number(driverByProduct[p.id]||0)} kantong</option>)}</select></Field><Field label="Jumlah yang dikembalikan"><input type="number" min="1" className={inputCls} value={q} onChange={e=>setQ(e.target.value)}/></Field></div><Btn tone="accent" onClick={send}>Kirim ke Gudang</Btn></Card>
    <Card><div className="flex flex-wrap justify-between gap-3 items-end mb-4"><div><b>Riwayat Pengembalian</b><div className="text-xs text-slate-500">Filter harian, bulanan, atau tahunan.</div></div><div className="grid grid-cols-2 gap-2"><Field label="Periode"><select className={inputCls} value={period} onChange={e=>setPeriod(e.target.value)}><option value="day">Harian</option><option value="month">Bulanan</option><option value="year">Tahunan</option></select></Field><Field label="Tanggal"><input type="date" className={inputCls} value={date} onChange={e=>setDate(e.target.value)}/></Field></div></div><div className="space-y-2">{history.map(r=><div key={r.id} className="p-4 rounded-xl border"><div className="flex justify-between gap-3"><div><b>{r.productName||'Es Kristal'} · {r.qty} kantong</b><div className="text-xs">{waktu(r.requestedAt)}</div></div><Pill tone={r.status==='approved'?'done':r.status==='pending'?'pending':'rejected'}>{r.status==='pending'?'MENUNGGU ACC GUDANG':r.status==='approved'?'APPROVE GUDANG / SELESAI':'DITOLAK'}</Pill></div>{r.status==='approved'&&<div className="text-xs text-emerald-700 mt-2">✓ Sudah dikembalikan dan di-ACC Gudang {waktu(r.receivedAt)}.</div>}{r.status==='pending'&&<div className="text-xs text-amber-700 mt-2">Barang sudah dikembalikan, menunggu ACC dari Gudang.</div>}{r.status==='rejected'&&<div className="text-xs text-rose-700 mt-2">✕ Ditolak Gudang {r.rejectedByName?`oleh ${r.rejectedByName}`:''} · Alasan: {r.rejectReason||'Alasan tidak dicatat.'}</div>}</div>)}{!history.length&&<div className="text-center text-slate-400 py-6">Belum ada riwayat pengembalian pada periode ini.</div>}</div></Card>
  </div>
}
function DriverApp({me}){const tabs=[{key:'home',label:'Beranda',icon:'🏠'},{key:'waitCash',label:'WAIT CASH',icon:'💵'},{key:'request',label:'Minta Stok',icon:'📦'},{key:'invoiceCustomers',label:'Pelanggan Invoice',icon:'🧾'},{key:'collection',label:'Penagihan Saya',icon:'💰'},{key:'return',label:'Kembalikan Sisa',icon:'↩️'},{key:'reports',label:'Laporan Saya',icon:'📑'}], [a,setA]=useState('home');return <Shell user={me} tabs={tabs} active={a} setActive={setA} onLogout={()=>{localStorage.removeItem('glasires_uid');location.reload()}}>{a==='home'&&<DriverHome me={me}/>} {a==='waitCash'&&<WaitCashDriver me={me}/>} {a==='request'&&<DriverRequest me={me}/>}  {a==='invoiceCustomers'&&<InvoiceDriver me={me}/>} {a==='collection'&&<InvoiceCollectionDriver me={me}/>} {a==='return'&&<DriverReturn me={me}/>} {a==='reports'&&<DriverOwnReport me={me}/>}</Shell>}

function GudangApp({me}){const tabs=[{key:'home',label:'Stok Gudang',icon:'🏔️'},{key:'release',label:'UPPROVE / ACC STOCK',icon:'✅'},{key:'returns',label:'Terima Kembalian',icon:'↩️'},{key:'reports',label:'Laporan Gudang',icon:'📑'}],[a,setA]=useState('home');return <Shell user={me} tabs={tabs} active={a} setActive={setA} onLogout={()=>{localStorage.removeItem('glasires_uid');location.reload()}}>{a==='home'&&<GudangHome me={me}/>} {a==='release'&&<GudangRelease me={me}/>} {a==='returns'&&<GudangReceive me={me}/>} {a==='reports'&&<GudangOwnReport me={me}/>}</Shell>}

function App(){const[loading,setLoading]=useState(true),[has,setHas]=useState(true),[me,setMe]=useState(null);useEffect(()=>{(async()=>{try{const s=await db.ref('users').once('value');setHas(s.exists());if(s.exists())await ensureBigSuperAdmin();const id=localStorage.getItem('glasires_uid');if(s.exists()&&id){const u=await db.ref('users/'+id).once('value');if(u.exists()&&u.val().active!==false)setMe({id,...u.val()});else localStorage.removeItem('glasires_uid')}}catch(e){console.error(e)}setLoading(false)})()},[]);if(loading)return <div className="min-h-screen flex items-center justify-center font-mono text-slate-400">Memuat GlasirEs…</div>;if(!has)return <SetupScreen onDone={()=>location.reload()}/>;if(!me)return <LoginScreen onLogin={setMe}/>;if(me.role==='bigsuperadmin')return <BigSuperAdmin me={me}/>;if(me.role==='superadmin')return <AdminApp me={me} isSuper/>;if(me.role==='admin')return <AdminApp me={me}/>;if(me.role==='driver')return <DriverApp me={me}/>;if(me.role==='gudang')return <GudangApp me={me}/>;return <div className="p-8">Peran tidak dikenal.</div>}
ReactDOM.createRoot(document.getElementById('root')).render(FIREBASE_INIT_ERROR?<div className="p-8 text-rose-600">Firebase error: {FIREBASE_INIT_ERROR}</div>:<App/>);

// Anti-inspect ringan; tidak mengganggu aplikasi.
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
