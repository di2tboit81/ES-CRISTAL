async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

}

 const all=useDbList('notifications');
 return useMemo(()=>toList(all).filter(n=>(n.toUser&&n.toUser===user.id)||(n.toRole&&n.toRole===user.role)||(!n.toUser&&!n.toRole)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),[all,user.id,user.role]);

 try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(1320,c.currentTime+.12);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.45);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.5)}catch(e){}
}

function SuperReports({me}){
 const ds=toList(useDbList('deliveries')),
       us=toList(useDbList('users')),
       wh=toList(useDbList('warehouse/history')),
       rr=toList(useDbList('returnRequests')),
       cfg=useDbValue('config/company',{}),
       [period,setPeriod]=useState('month'),
       [date,setDate]=useState(new Date().toISOString().slice(0,10)),
       [driverId,setDriverId]=useState(''),
       [report,setReport]=useState('revenue'),
       [selectedUsers,setSelectedUsers]=useState([]),
       [toast,show]=useToast();

 const range=useMemo(()=>{
   const base=new Date(date+'T00:00:00');
   let a=new Date(base), b=new Date(base);
   if(period==='day'){a.setHours(0,0,0,0);b.setHours(23,59,59,999)}
   else if(period==='month'){a=new Date(base.getFullYear(),base.getMonth(),1);b=new Date(base.getFullYear(),base.getMonth()+1,0,23,59,59,999)}
   else {a=new Date(base.getFullYear(),0,1);b=new Date(base.getFullYear(),11,31,23,59,59,999)}
   return {start:a.getTime(),end:b.getTime(),a,b}
 },[period,date]);

 const inRange=x=>{const t=+x||0;return t>=range.start&&t<=range.end};
 const rows=ds.filter(d=>inRange(d.timestamp)&&(!driverId||d.driverId===driverId));
 const warehouse=wh.filter(x=>inRange(x.timestamp));
 const returns=rr.filter(x=>inRange(x.requestedAt||x.receivedAt));

 const revenue=rows.reduce((a,d)=>a+(+d.total||0),0);
 const cash=rows.filter(d=>d.paymentMethod==='cash').reduce((a,d)=>a+(+d.total||0),0);
 const invoice=rows.filter(d=>d.paymentMethod==='invoice').reduce((a,d)=>a+(+d.total||0),0);
 const paid=rows.filter(d=>d.paymentMethod==='invoice'&&d.paymentStatus==='paid').reduce((a,d)=>a+(+d.total||0),0);
 const unpaid=Math.max(0,invoice-paid);
 const qty=rows.reduce((a,d)=>a+(+d.qty||0),0);
 const masuk=warehouse.filter(x=>x.type==='masuk').reduce((a,x)=>a+(+x.qty||0),0);
 const keluar=warehouse.filter(x=>x.type==='keluar').reduce((a,x)=>a+(+x.qty||0),0);
 const kembali=returns.filter(x=>x.status==='received').reduce((a,x)=>a+(+x.qty||0),0);
 const currentStock=useDbValue('warehouse/stock',0);

 const drivers=us.filter(u=>u.role==='driver'&&u.active!==false);
 const driverStats=drivers.map(u=>{
   const r=rows.filter(d=>d.driverId===u.id);
   const q=r.reduce((a,d)=>a+(+d.qty||0),0);
   const val=r.reduce((a,d)=>a+(+d.total||0),0);
   const p=r.filter(d=>d.paymentStatus==='paid'||d.paymentMethod==='cash').reduce((a,d)=>a+(+d.total||0),0);
   return {u,count:r.length,qty:q,value:val,paid:p,unpaid:Math.max(0,val-p)};
 }).sort((a,b)=>b.value-a.value);

 const maxDriver=Math.max(1,...driverStats.map(x=>x.value));
 const pct=(v,total)=>total?Math.round(v/total*100):0;
 const periodLabel=period==='day'?'HARIAN':period==='month'?'BULANAN':'TAHUNAN';
 const money=n=>rupiah(n||0);

 const print=()=>window.print();

 const exportPdf=()=>{
   try{
     const {jsPDF}=window.jspdf;
     const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
     const title=report==='revenue'?'LAPORAN PENDAPATAN':report==='warehouse'?'LAPORAN GUDANG':'LAPORAN KINERJA DRIVER';
     pdf.setFont('helvetica','bold');pdf.setFontSize(17);pdf.text(cfg.name||'GlasirEs',15,16);
     pdf.setFont('helvetica','normal');pdf.setFontSize(9);
     pdf.text(cfg.address||'',15,22);pdf.text(cfg.phone||'',15,27);
     pdf.setFont('helvetica','bold');pdf.setFontSize(13);pdf.text(title,15,38);
     pdf.setFont('helvetica','normal');pdf.setFontSize(9);
     pdf.text(`Periode ${periodLabel}: ${range.a.toLocaleDateString('id-ID')} s/d ${range.b.toLocaleDateString('id-ID')}`,15,44);
     let y=54;
     if(report==='revenue'){
       pdf.text(`Pendapatan: ${money(revenue)}`,15,y);y+=6;
       pdf.text(`CASH: ${money(cash)} (${pct(cash,revenue)}%)`,15,y);y+=6;
       pdf.text(`INVOICE: ${money(invoice)} (${pct(invoice,revenue)}%)`,15,y);y+=6;
       pdf.text(`LUNAS: ${money(paid)} (${pct(paid,invoice)}% dari invoice)`,15,y);y+=6;
       pdf.text(`BELUM LUNAS: ${money(unpaid)} (${pct(unpaid,invoice)}% dari invoice)`,15,y);y+=9;
       pdf.text(`Transaksi: ${rows.length} | Kantong: ${qty}`,15,y);y+=7;pdf.setFillColor(14,165,233);pdf.rect(15,y,70*(revenue?cash/revenue:0),5,'F');pdf.setFillColor(34,197,94);pdf.rect(15+70*(revenue?cash/revenue:0),y,70*(revenue?invoice/revenue:0),5,'F');y+=9;pdf.text(`Diagram CASH ${pct(cash,revenue)}% · INVOICE ${pct(invoice,revenue)}%`,15,y);y+=7;
     }else if(report==='warehouse'){
       pdf.text(`Stok saat ini: ${currentStock} kantong`,15,y);y+=6;
       pdf.text(`Masuk: ${masuk} kantong`,15,y);y+=6;
       pdf.text(`Keluar: ${keluar} kantong`,15,y);y+=6;
       pdf.text(`Kembali diterima: ${kembali} kantong`,15,y);y+=7;const wt=masuk+keluar+kembali||1;pdf.setFillColor(34,197,94);pdf.rect(15,y,70*masuk/wt,5,'F');pdf.setFillColor(239,68,68);pdf.rect(15+70*masuk/wt,y,70*keluar/wt,5,'F');pdf.setFillColor(139,92,246);pdf.rect(15+70*(masuk+keluar)/wt,y,70*kembali/wt,5,'F');y+=7;pdf.text(`Diagram arus: Masuk ${pct(masuk,wt)}% · Keluar ${pct(keluar,wt)}% · Kembali ${pct(kembali,wt)}%`,15,y);y+=9;
     }else{
       pdf.text(`Total driver aktif: ${driverStats.length}`,15,y);y+=7;driverStats.slice(0,10).forEach((d,i)=>{const w=60*(maxDriver?d.value/maxDriver:0);pdf.setFillColor(14,165,233);pdf.rect(15,y,w,4,'F');pdf.setFontSize(7);pdf.setTextColor(30,41,59);pdf.text(`${d.u.name} ${pct(d.value,revenue)}%`,78,y+3);y+=6});pdf.setTextColor(0,0,0);y+=4;
     }
     pdf.setFont('helvetica','bold');pdf.text('RINGKASAN',15,y);y+=6;
     pdf.setFont('helvetica','normal');pdf.setFontSize(8);
     if(report==='driver'){
       driverStats.slice(0,22).forEach((d,i)=>{
         pdf.text(`${i+1}. ${d.u.name} | ${d.count} trx | ${d.qty} kantong | ${money(d.value)} | ${pct(d.value,revenue)}%`,15,y);
         y+=5;if(y>282){pdf.addPage();y=18}
       });
     }else if(report==='warehouse'){
       warehouse.slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).slice(0,32).forEach((x,i)=>{
         pdf.text(`${i+1}. ${new Date(x.timestamp).toLocaleDateString('id-ID')} | ${x.type.toUpperCase()} | ${x.qty} | ${x.byName||x.driverName||'-'}`,15,y);
         y+=5;if(y>282){pdf.addPage();y=18}
       });
     }else{
       rows.slice().sort((a,b)=>b.timestamp-a.timestamp).slice(0,30).forEach((d,i)=>{
         pdf.text(`${i+1}. ${new Date(d.timestamp).toLocaleDateString('id-ID')} | ${d.driverName} | ${d.customerName} | ${d.qty} | ${money(d.total)}`,15,y);
         y+=5;if(y>282){pdf.addPage();y=18}
       });
     }
     pdf.save(`glasires-${report}-${period}.pdf`);
   }catch(e){show('PDF gagal: '+e.message,'err')}
 };

 const sendReport=async()=>{
   if(!selectedUsers.length)return show('Pilih minimal satu user penerima.','err');
   const title=report==='revenue'?'Laporan Pendapatan':report==='warehouse'?'Laporan Gudang':'Laporan Kinerja Driver';
   const message=report==='revenue'
     ? `${title} ${periodLabel}: ${money(revenue)} | CASH ${money(cash)} | INVOICE ${money(invoice)} | LUNAS ${money(paid)} | BELUM ${money(unpaid)}.`
     : report==='warehouse'
     ? `${title} ${periodLabel}: Stok ${currentStock} kantong | Masuk ${masuk} | Keluar ${keluar} | Kembali ${kembali}.`
     : `${title} ${periodLabel}: ${driverStats.length} driver | ${qty} kantong | ${money(revenue)}.`;
   for(const uid of selectedUsers){
     await notify({title,message,type:'report',toUser:uid,fromUser:me.id,data:{
       report,period,periodStart:range.start,periodEnd:range.end,
       revenue,cash,invoice,paid,unpaid,qty,masuk,keluar,kembali,currentStock,
       driverCount:driverStats.length
     }});
   }
   show(`Laporan berhasil dikirim ke ${selectedUsers.length} user.`);
 };

 const toggleUser=id=>setSelectedUsers(v=>v.includes(id)?v.filter(x=>x!==id):[...v,id]);
 const doughnut=(a,b)=>{
   const total=(+a||0)+(+b||0),pa=total?pct(a,total):50;
   return {background:`conic-gradient(#0ea5e9 0 ${pa}%, #22c55e ${pa}% 100%)`};
 };

function DriverOwnReport({me}){
 const ds=toList(useDbList('deliveries')).filter(d=>d.driverId===me.id),
       cfg=useDbValue('config/company',{}),
       [period,setPeriod]=useState('day'),
       [date,setDate]=useState(new Date().toISOString().slice(0,10)),
       [toast,show]=useToast();
 const start=new Date(date+'T00:00:00'); let end=new Date(start);
 if(period==='day'){start.setHours(0,0,0,0);end.setHours(23,59,59,999)}
 else if(period==='month'){start.setDate(1);start.setHours(0,0,0,0);end=new Date(start.getFullYear(),start.getMonth()+1,0,23,59,59,999)}
 else {start.setMonth(0,0);start.setHours(0,0,0,0);end=new Date(start.getFullYear(),11,31,23,59,59,999)}

 const dough=(a,b)=>{const t=a+b||1,pa=pct(a,t);return {background:`conic-gradient(#0ea5e9 0 ${pa}%, #8b5cf6 ${pa}% 100%)`}};
 return <div className="fade-in">{toast}
   <div className="no-print">

    <div className="grid md:grid-cols-4 gap-3 my-5"><div className="p-4 rounded-2xl bg-sky-50 border"><small>TRANSAKSI</small><b className="block text-2xl text-sky-700">{rows.length}</b></div><div className="p-4 rounded-2xl bg-cyan-50 border"><small>KANTONG</small><b className="block text-2xl text-cyan-700">{qty}</b></div><div className="p-4 rounded-2xl bg-emerald-50 border"><small>NILAI PENJUALAN</small><b className="block text-xl text-emerald-700">{rupiah(total)}</b></div><div className="p-4 rounded-2xl bg-amber-50 border"><small>BELUM LUNAS</small><b className="block text-xl text-amber-700">{rupiah(unpaid)}</b></div></div>

 const print=()=>window.print();
 const pdf=()=>{try{const {jsPDF}=window.jspdf,p=new jsPDF();p.setFont('helvetica','bold');p.setFontSize(17);p.text(cfg.name||'GlasirEs',15,17);p.setFontSize(10);p.setFont('helvetica','normal');p.text(cfg.address||'',15,24);p.text(cfg.phone||'',15,30);p.setFont('helvetica','bold');p.setFontSize(14);p.text('LAPORAN GUDANG',15,42);p.setFont('helvetica','normal');p.setFontSize(9);p.text(`Petugas: ${me.name}`,15,48);p.text(`Periode: ${start.toLocaleDateString('id-ID')} - ${end.toLocaleDateString('id-ID')}`,15,54);p.text(`Stok saat ini: ${stock} kantong`,15,63);p.text(`Masuk: ${masuk} kantong (${pct(masuk,masuk+keluar)}%)`,15,69);p.text(`Keluar: ${keluar} kantong (${pct(keluar,masuk+keluar)}%)`,15,75);p.text(`Kembali diterima: ${kembali} kantong`,15,81);let y=92;p.setFontSize(8);rows.slice(0,35).forEach((x,i)=>{p.text(`${i+1}. ${new Date(x.timestamp).toLocaleDateString('id-ID')} | ${x.type.toUpperCase()} | ${x.qty} | ${x.byName||x.driverName||'-'}`,15,y);y+=6;if(y>285){p.addPage();y=18}});p.save(`laporan-gudang-${me.username}-${period}.pdf`)}catch(e){show('PDF gagal: '+e.message,'err')}};
 const dough=(a,b,c)=>{const t=(+a||0)+(+b||0)+(+c||0)||1,pa=(+a||0)/t*100,pb=((+a||0)+(+b||0))/t*100;return {background:`conic-gradient(#22c55e 0 ${pa}%, #ef4444 ${pa}% ${pb}%, #8b5cf6 ${pb}% 100%)`}};
 return <div className="fade-in">{toast}
  <div className="no-print"><div className="flex flex-wrap justify-between items-center gap-3 mb-5"><div><h2 className="font-display font-bold text-xl">📦 Laporan Gudang Saya</h2><p className="text-sm text-slate-500">Laporan khusus <b>{me.name}</b>. Hanya aktivitas gudang yang dilakukan akun ini.</p></div></div><Card className="mb-5"><div className="grid sm:grid-cols-2 gap-3"><Field label="Periode"><select className={inputCls} value={period} onChange={e=>setPeriod(e.target.value)}><option value="day">Harian</option><option value="month">Bulanan</option><option value="year">Tahunan</option></select></Field><Field label="Tanggal Acuan"><input type="date" className={inputCls} value={date} onChange={e=>setDate(e.target.value)}/></Field></div></Card></div>
  <div className="report-page report-print-area" style={{'--report-color':cfg.reportColor||'#1c4a73'}}>
   <div className="report-head">{cfg.logo&&<img className="report-logo" src={cfg.logo}/>}<div><div className="report-title text-2xl font-bold">{cfg.name||'GlasirEs'}</div><div className="text-sm">{cfg.address||''}</div><div className="text-sm">{cfg.phone||''}</div></div></div>
   <div className="mt-6 flex justify-between"><div><h1 className="text-2xl font-display font-bold">LAPORAN AKTIVITAS GUDANG</h1><p className="text-sm">Petugas: <b>{me.name}</b> · @{me.username}</p><p className="text-sm">Periode: {start.toLocaleDateString('id-ID')} s/d {end.toLocaleDateString('id-ID')}</p></div><div className="text-right text-xs text-slate-500">Khusus akun gudang ini<br/>Tidak menampilkan gudang/user lain</div></div>
   <div className="grid md:grid-cols-4 gap-3 my-5"><div className="p-4 rounded-2xl bg-cyan-50 border"><small>STOK SAAT INI</small><b className="block text-2xl text-cyan-700">{stock}</b><span className="text-xs">kantong</span></div><div className="p-4 rounded-2xl bg-emerald-50 border"><small>MASUK</small><b className="block text-2xl text-emerald-700">{masuk}</b><span className="text-xs">{pct(masuk,masuk+keluar)}%</span></div><div className="p-4 rounded-2xl bg-rose-50 border"><small>KELUAR</small><b className="block text-2xl text-rose-700">{keluar}</b><span className="text-xs">{pct(keluar,masuk+keluar)}%</span></div><div className="p-4 rounded-2xl bg-violet-50 border"><small>KEMBALI DITERIMA</small><b className="block text-2xl text-violet-700">{kembali}</b><span className="text-xs">kantong</span></div></div>
   <div className="grid md:grid-cols-2 gap-5 mb-5"><Card><h3 className="font-bold mb-4">Diagram Masuk vs Keluar</h3><div className="flex items-center gap-6"><div className="w-40 h-40 rounded-full relative" style={dough(masuk,keluar,kembali)}><div className="absolute inset-5 bg-white rounded-full flex items-center justify-center text-xs text-center font-bold">{masuk+keluar}<br/>aktivitas</div></div><div className="text-sm space-y-3"><div>🟢 MASUK <b>{pct(masuk,masuk+keluar+kembali)}%</b><br/><span className="ml-5">{masuk} kantong</span></div><div>🔴 KELUAR <b>{pct(keluar,masuk+keluar+kembali)}%</b><br/><span className="ml-5">{keluar} kantong</span></div><div>🟣 KEMBALI <b>{pct(kembali,masuk+keluar+kembali)}%</b><br/><span className="ml-5">{kembali} kantong</span></div></div></div></Card><Card><h3 className="font-bold mb-4">Ringkasan Periode</h3><div className="space-y-3 text-sm"><div className="flex justify-between border-b pb-2"><span>Stok saat ini</span><b>{stock} kantong</b></div><div className="flex justify-between border-b pb-2"><span>Masuk periode ini</span><b className="text-emerald-600">{masuk} kantong</b></div><div className="flex justify-between border-b pb-2"><span>Keluar periode ini</span><b className="text-rose-600">{keluar} kantong</b></div><div className="flex justify-between"><span>Kembali diterima</span><b>{kembali} kantong</b></div></div></Card></div>
   <Card><h3 className="font-bold mb-4">Detail Aktivitas Gudang Saya</h3><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="border-b text-left"><th className="py-2">No</th><th>Tanggal</th><th>Jenis</th><th>Jumlah</th><th>Driver / Keterangan</th></tr></thead><tbody>{rows.map((x,i)=><tr key={x.id} className="border-b"><td className="py-2">{i+1}</td><td>{new Date(x.timestamp).toLocaleDateString('id-ID')}</td><td>{x.type==='masuk'?'🟢 MASUK':'🔴 KELUAR'}</td><td>{x.qty} kantong</td><td>{x.driverName||x.note||'-'}</td></tr>)}{ret.map((x,i)=><tr key={'r'+x.id} className="border-b"><td className="py-2">{rows.length+i+1}</td><td>{new Date(x.receivedAt).toLocaleDateString('id-ID')}</td><td>🟣 KEMBALI</td><td>{x.qty} kantong</td><td>{x.driverName||'-'}</td></tr>)}{!rows.length&&!ret.length&&<tr><td colSpan="5" className="py-8 text-center text-slate-400">Belum ada aktivitas pada periode ini.</td></tr>}</tbody></table></div></Card>
   <div className="sig"><div>Mengetahui,<div className="sigline"></div><b>{cfg.name||'Perusahaan'}</b></div><div>Dibuat oleh,<div className="sigline"></div><b>{me.name}</b><div className="text-xs">Gudang</div></div></div><div className="text-center text-[10px] text-slate-400 mt-8">Power by Syech B@-it · Copyright © 2026</div>
  </div>
 </div>
}

function DriverApp({me}){const tabs=[{key:'home',label:'Beranda',icon:'🏠'},{key:'request',label:'Minta Stok',icon:'📦'},{key:'invoiceCustomers',label:'Pelanggan Invoice',icon:'🧾'},{key:'collection',label:'Penagihan Saya',icon:'💰'},{key:'return',label:'Kembalikan Sisa',icon:'↩️'},{key:'reports',label:'Laporan Saya',icon:'📑'}], [a,setA]=useState('home');return <Shell user={me} tabs={tabs} active={a} setActive={setA} onLogout={()=>{localStorage.removeItem('glasires_uid');location.reload()}}>{a==='home'&&<DriverHome me={me}/>} {a==='request'&&<DriverRequest me={me}/>} {a==='invoiceCustomers'&&<InvoiceDriver me={me}/>} {a==='collection'&&<InvoiceCollectionDriver me={me}/>} {a==='return'&&<DriverReturn me={me}/>} {a==='reports'&&<DriverOwnReport me={me}/>}</Shell>}

function GudangApp({me}){const tabs=[{key:'home',label:'Stok Gudang',icon:'🏔️'},{key:'release',label:'Keluarkan ke Driver',icon:'🚚'},{key:'returns',label:'Terima Kembalian',icon:'↩️'},{key:'reports',label:'Laporan Gudang',icon:'📑'}],[a,setA]=useState('home');return <Shell user={me} tabs={tabs} active={a} setActive={setA} onLogout={()=>{localStorage.removeItem('glasires_uid');location.reload()}}>{a==='home'&&<GudangHome me={me}/>} {a==='release'&&<GudangRelease me={me}/>} {a==='returns'&&<GudangReceive me={me}/>} {a==='reports'&&<GudangOwnReport me={me}/>}</Shell>}

function App(){const[loading,setLoading]=useState(true),[has,setHas]=useState(true),[me,setMe]=useState(null);useEffect(()=>{(async()=>{try{const s=await db.ref('users').once('value');setHas(s.exists());if(s.exists())await ensureBigSuperAdmin();const id=localStorage.getItem('glasires_uid');if(s.exists()&&id){const u=await db.ref('users/'+id).once('value');if(u.exists()&&u.val().active!==false)setMe({id,...u.val()});else localStorage.removeItem('glasires_uid')}}catch(e){console.error(e)}setLoading(false)})()},[]);if(loading)return <div className="min-h-screen flex items-center justify-center font-mono text-slate-400">Memuat GlasirEs…</div>;if(!has)return <SetupScreen onDone={()=>location.reload()}/>;if(!me)return <LoginScreen onLogin={setMe}/>;if(me.role==='bigsuperadmin')return <BigSuperAdmin me={me}/>;if(me.role==='superadmin')return <AdminApp me={me} isSuper/>;if(me.role==='admin')return <AdminApp me={me}/>;if(me.role==='driver')return <DriverApp me={me}/>;if(me.role==='gudang')return <GudangApp me={me}/>;return <div className="p-8">Peran tidak dikenal.</div>}
ReactDOM.createRoot(document.getElementById('root')).render(FIREBASE_INIT_ERROR?<div className="p-8 text-rose-600">Firebase error: {FIREBASE_INIT_ERROR}</div>:<App/>);

// Anti-inspect ringan; tidak mengganggu aplikasi.
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
