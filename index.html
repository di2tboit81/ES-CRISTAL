<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GlasirEs — Sistem Distribusi Es Kristal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{display:['Sora','sans-serif'],body:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']},colors:{glacier:{950:'#050B14',900:'#0A1B2E',800:'#0F2A45',700:'#153A5C',600:'#1C4A73'},frost:{400:'#7FE0F0',300:'#A6ECF6',200:'#CFF6FB'},ice:{50:'#F3FBFD'}}}}};
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>





<link rel="stylesheet" href="css/style.css">
</head>
<body class="text-glacier-900">
<div id="root"></div>
<script>
window.__appErrors=[];
addEventListener('error',e=>window.__appErrors.push((e.message||'Error')+' — '+(e.filename||'')+':'+(e.lineno||'')));
addEventListener('unhandledrejection',e=>window.__appErrors.push('Promise error: '+(e.reason?.message||e.reason)));
setTimeout(()=>{const r=document.getElementById('root');if(r&&!r.innerHTML.trim())r.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui;background:#F3FBFD"><div style="max-width:650px;background:white;border:1px solid #e5eef2;border-radius:16px;padding:28px"><b style="color:#e11d48">HALAMAN GAGAL DIMUAT</b><p>Aplikasi tidak berhasil tampil. Periksa koneksi CDN/Internet.</p><pre style="white-space:pre-wrap;background:#f8fafc;padding:14px">'+(window.__appErrors.join('\\n')||'Tidak ada error JavaScript tertangkap.')+'</pre></div></div>'}},6000);
</script>


<script src="js/01-core-config.js"></script>
<script src="js/02-big-superadmin-admin.js"></script>
<script src="js/03-notifications.js"></script>
<script src="js/04-ui-components.js"></script>
<script src="js/05-gudang.js"></script>
<script src="js/06-driver.js"></script>
<script src="js/07-invoice-reports.js"></script>
<script src="js/08-role-apps.js"></script>
<script src="js/09-app-entry.js"></script>
</body>
</html>
