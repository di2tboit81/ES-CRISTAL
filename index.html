  window.__appErrors = [];

    window.__appErrors.push((e.message||'Error') + ' — ' + (e.filename ? e.filename.split('/').pop() : '') + ':' + (e.lineno||''));

  window.addEventListener('unhandledrejection', function(e){
    window.__appErrors.push('Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));

    var root = document.getElementById('root');

      var errList = window.__appErrors.length

/* ---------------------------- util ---------------------------- */
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function rupiah(n){ return 'Rp' + Math.round(n||0).toLocaleString('id-ID'); }
function waktu(ts){ return ts ? new Date(ts).toLocaleString('id-ID', {dateStyle:'medium', timeStyle:'short'}) : '-'; }
function useDbList(path){
  const [data, setData] = useState({});
  useEffect(() => {
    const ref = db.ref(path);
    const cb = snap => setData(snap.val() || {});
    ref.on('value', cb);
    return () => ref.off('value', cb);
  }, [path]);
  return data;
}
function useDbValue(path, fallback){
  const [data, setData] = useState(fallback);
  useEffect(() => {
    const ref = db.ref(path);
    const cb = snap => setData(snap.val() === null ? fallback : snap.val());
    ref.on('value', cb);
    return () => ref.off('value', cb);
  }, [path]);
  return data;
}
function toList(obj){ return Object.entries(obj||{}).map(([id,v]) => ({ id, ...v })); }

function useNotifications(user){

    const all = useDbList("notifications");

    return useMemo(()=>{

        return Object.entries(all||{})

        .map(([id,v])=>({

            id,

            ...v

        }))

        .filter(n=>{

            if(n.toUser && n.toUser===user.id) return true;

            if(n.toRole && n.toRole===user.role) return true;

            if(!n.toUser && !n.toRole) return true;

            return false;

        })

        .sort((a,b)=>b.createdAt-a.createdAt);

    },[all,user]);

}

function unreadCount(list){

    return list.filter(i=>!i.read).length;

}

async function markNotificationRead(id){

    await db.ref("notifications/"+id+"/read").set(true);

}

/* ---------------------------- Toast ---------------------------- */
function useToast(){
  const [toast, setToast] = useState(null);
  const show = (msg, tone='ok') => { setToast({msg, tone}); setTimeout(()=>setToast(null), 3200); };
  const el = toast && (
    <div className={"fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium fade-in " + (toast.tone==='err' ? "bg-rose-600 text-white" : "bg-glacier-900 text-white")}>
      {toast.msg}
    </div>
  );
  return [el, show];
}

function SetupScreen({ onDone }){
  const [name, setName] = useState(''); const [username, setUsername] = useState(''); const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
  const submit = async () => {
    if (!name || !username || !password) { setErr('Semua kolom wajib diisi.'); return; }
    setBusy(true); setErr('');
    try {
      const passwordHash = await sha256(password);
      const ref = db.ref('users').push();
      await ref.set({ name, username, passwordHash, role:'superadmin', active:true, createdAt: Date.now() });
      await db.ref('config/pricePerBag').set(15000);
      await db.ref('warehouse/stock').set(0);
      onDone();
    } catch(e){ setErr('Gagal menyimpan: ' + e.message); }
    setBusy(false);
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <Card className="w-full max-w-md fade-in">
        <div className="text-xs font-mono tracking-widest text-frost-400 mb-1">SETUP AWAL</div>
        <h1 className="font-display font-bold text-2xl text-glacier-900 mb-1">Buat Akun Super Admin</h1>
        <p className="text-sm text-glacier-500 mb-5">Belum ada pengguna di sistem ini. Buat akun Super Admin pertama untuk mulai.</p>
        <Field label="Nama Lengkap"><input className={inputCls} value={name} onChange={e=>setName(e.target.value)} placeholder="Nama kamu" /></Field>
        <Field label="Username"><input className={inputCls} value={username} onChange={e=>setUsername(e.target.value.trim())} placeholder="mis. admin1" /></Field>
        <Field label="Password"><input type="password" className={inputCls} value={password} onChange={e=>setPassword(e.target.value)} placeholder="Minimal 6 karakter" /></Field>
        {err && <div className="text-rose-600 text-sm mb-3">{err}</div>}
        <Btn tone="accent" className="w-full" onClick={submit} disabled={busy}>{busy ? 'Menyimpan…' : 'Buat Super Admin & Masuk'}</Btn>
      </Card>
    </div>
  );
}

function LoginScreen({ onLogin }){
  const [username, setUsername] = useState(''); const [password, setPassword] = useState('');
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const submit = async () => {
    setErr(''); setBusy(true);
    try {
      const snap = await db.ref('users').once('value');
      const users = toList(snap.val());
      const found = users.find(u => u.username === username.trim());
      if (!found || found.active === false) { setErr('Username tidak ditemukan atau nonaktif.'); setBusy(false); return; }
      const hash = await sha256(password);
      if (hash !== found.passwordHash) { setErr('Password salah.'); setBusy(false); return; }
      localStorage.setItem('glasires_uid', found.id);
      onLogin(found);
    } catch(e){ setErr('Gagal login: ' + e.message); }
    setBusy(false);
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="w-full max-w-md fade-in">
        <div className="text-center mb-7">
          <div className="inline-flex items-center gap-2 justify-center mb-3">
            <div className="icebar-shell" style={{width:28,height:36}}><div className="icebar-fill w-full" style={{height:'70%'}}></div></div>
            <span className="font-display font-extrabold text-2xl text-glacier-900 tracking-tight">GlasirEs</span>
          </div>
          <p className="text-sm text-glacier-500">Sistem distribusi & stok es kristal</p>
        </div>
        <Card>
          <Field label="Username"><input className={inputCls} value={username} onChange={e=>setUsername(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} /></Field>
          <Field label="Password"><input type="password" className={inputCls} value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} /></Field>
          {err && <div className="text-rose-600 text-sm mb-3">{err}</div>}
          <Btn tone="accent" className="w-full" onClick={submit} disabled={busy}>{busy ? 'Memeriksa…' : 'Masuk'}</Btn>
        </Card>
      </div>
    </div>
  );
}

/* =========================================================================
   MANAGE USERS (shared by Admin / SuperAdmin, role scope differs)
   ========================================================================= */
function ManageUsers({ me, allowedRoles, title }){
  const users = toList(useDbList('users'));
  const [name, setName] = useState(''); const [username, setUsername] = useState('');
  const [password, setPassword] = useState(''); const [role, setRole] = useState(allowedRoles[0]);
  const [busy, setBusy] = useState(false);
  const [toast, showToast] = useToast();

  const visibleUsers = users.filter(u => allowedRoles.includes(u.role));

  const addUser = async () => {
    if (!name || !username || !password) { showToast('Nama, username, dan password wajib diisi.', 'err'); return; }
    if (users.some(u => u.username === username.trim())) { showToast('Username sudah dipakai.', 'err'); return; }
    setBusy(true);
    try {
      const passwordHash = await sha256(password);
      await db.ref('users').push({ name, username: username.trim(), passwordHash, role, active:true, createdAt: Date.now() });
      if (role === 'driver') await db.ref('driverStock/' + username.trim()).set(0);
      setName(''); setUsername(''); setPassword('');
      showToast('Pengguna ' + name + ' berhasil ditambahkan.');
    } catch(e){ showToast('Gagal: ' + e.message, 'err'); }
    setBusy(false);
  };

  const toggleActive = async (u) => {

/* =========================================================================

function ApproveRequests({ me }){
  const requests = toList(useDbList('stockRequests')).sort((a,b)=>b.requestedAt-a.requestedAt);
  const [toast, showToast] = useToast();
  const pending = requests.filter(r=>r.status==='pending');
  const others = requests.filter(r=>r.status!=='pending');

  const approve = async (r) => {
    await db.ref('stockRequests/'+r.id).update({ status:'approved', approvedBy: me.id, approvedByName: me.name, approvedAt: Date.now() });
    showToast('Permintaan ' + r.driverName + ' disetujui. Gudang bisa keluarkan stok sekarang.');
  };
  const reject = async (r) => {
    await db.ref('stockRequests/'+r.id).update({ status:'rejected', approvedBy: me.id, approvedByName: me.name, approvedAt: Date.now() });
    showToast('Permintaan ditolak.', 'err');
  };

  return (
    <div className="fade-in">
      {toast}
      <h2 className="font-display font-bold text-xl text-glacier-900 mb-5">Persetujuan Permintaan Stok</h2>
      <Card className="mb-5">
        <div className="text-sm font-semibold text-glacier-800 mb-4">Menunggu Persetujuan ({pending.length})</div>

            <div key={r.id} className="flex items-center justify-between px-4 py-3 rounded-xl border border-amber-200 bg-amber-50/60">
              <div>
                <div className="text-sm font-semibold text-glacier-900">{r.driverName}</div>
                <div className="text-xs text-glacier-500">minta {r.qtyRequested} kantong · {waktu(r.requestedAt)}</div>
              </div>
              <div className="flex gap-2">
                <Btn tone="accent" className="!px-3 !py-1.5 text-xs" onClick={()=>approve(r)}>✓ ACC</Btn>
                <Btn tone="danger" className="!px-3 !py-1.5 text-xs" onClick={()=>reject(r)}>Tolak</Btn>
              </div>
            </div>
          ))}
          {pending.length===0 && <div className="text-sm text-glacier-400 py-4 text-center">Tidak ada permintaan yang menunggu.</div>}
        </div>
      </Card>

          ))}

      </Card>
    </div>
  );
}

function GudangRelease({ me }){
  const requests = toList(useDbList('stockRequests')).filter(r=>r.status==='approved').sort((a,b)=>a.approvedAt-b.approvedAt);
  const stock = useDbValue('warehouse/stock', 0);
  const [toast, showToast] = useToast();

  const release = async (r) => {
    if (r.qtyRequested > stock) { showToast('Stok gudang tidak cukup (sisa ' + stock + ').', 'err'); return; }
    const usersSnap = await db.ref('users/' + r.driverId).once('value');
    const driverUsername = (usersSnap.val()||{}).username;
    if (!driverUsername) { showToast('Data driver tidak ditemukan.', 'err'); return; }
    await db.ref('warehouse/stock').transaction(cur => (cur||0) - r.qtyRequested);
    await db.ref('driverStock/' + driverUsername).transaction(cur => (cur||0) + r.qtyRequested);
    await db.ref('stockRequests/'+r.id).update({ status:'fulfilled', fulfilledBy: me.id, fulfilledByName: me.name, fulfilledAt: Date.now() });
    await db.ref('warehouse/history').push({ type:'keluar', qty:r.qtyRequested, driverId:r.driverId, driverName:r.driverName, by: me.id, byName: me.name, timestamp: Date.now() });
    showToast('Stok dikeluarkan untuk ' + r.driverName + '.');
  };

  return (
    <div className="fade-in">
      {toast}
      <h2 className="font-display font-bold text-xl text-glacier-900 mb-5">Keluarkan Stok ke Driver</h2>
      <Card>
        <div className="text-sm font-semibold text-glacier-800 mb-4">Sudah Disetujui Admin, Menunggu Dikeluarkan ({requests.length})</div>
        <div className="space-y-2.5">
          {requests.map(r => (
            <div key={r.id} className="flex items-center justify-between px-4 py-3 rounded-xl border border-sky-200 bg-sky-50/60">
              <div>
                <div className="text-sm font-semibold text-glacier-900">{r.driverName}</div>
                <div className="text-xs text-glacier-500">{r.qtyRequested} kantong · disetujui {r.approvedByName} · {waktu(r.approvedAt)}</div>
              </div>
              <Btn tone="accent" className="!px-3 !py-1.5 text-xs" onClick={()=>release(r)}>Keluarkan Stok</Btn>
            </div>
          ))}
          {requests.length===0 && <div className="text-sm text-glacier-400 py-6 text-center">Tidak ada permintaan yang menunggu dikeluarkan.</div>}
        </div>
      </Card>
    </div>
  );
}

function GudangReceiveReturns({ me }){
  const returns = toList(useDbList('returnRequests')).filter(r=>r.status==='pending').sort((a,b)=>a.requestedAt-b.requestedAt);
  const [toast, showToast] = useToast();

  const receive = async (r) => {
    await db.ref('warehouse/stock').transaction(cur => (cur||0) + r.qty);
    const usersSnap = await db.ref('users/' + r.driverId).once('value');
    const driverUsername = (usersSnap.val()||{}).username;
    if (driverUsername) {
      await db.ref('driverStock/' + driverUsername).transaction(cur => Math.max(0, (cur||0) - r.qty));
    }
    await db.ref('returnRequests/'+r.id).update({ status:'received', receivedBy: me.id, receivedByName: me.name, receivedAt: Date.now() });
    await db.ref('warehouse/history').push({ type:'kembali', qty:r.qty, driverId:r.driverId, driverName:r.driverName, by: me.id, byName: me.name, timestamp: Date.now() });
    showToast('Sisa es dari ' + r.driverName + ' diterima kembali.');
  };

  return (
    <div className="fade-in">
      {toast}
      <h2 className="font-display font-bold text-xl text-glacier-900 mb-5">Terima Sisa Es dari Driver</h2>
      <Card>
        <div className="text-sm font-semibold text-glacier-800 mb-4">Menunggu Diterima ({returns.length})</div>
        <div className="space-y-2.5">
          {returns.map(r => (
            <div key={r.id} className="flex items-center justify-between px-4 py-3 rounded-xl border border-amber-200 bg-amber-50/60">
              <div>
                <div className="text-sm font-semibold text-glacier-900">{r.driverName}</div>
                <div className="text-xs text-glacier-500">{r.qty} kantong · dikirim {waktu(r.requestedAt)}</div>
              </div>
              <Btn tone="accent" className="!px-3 !py-1.5 text-xs" onClick={()=>receive(r)}>Terima</Btn>
            </div>
          ))}
          {returns.length===0 && <div className="text-sm text-glacier-400 py-6 text-center">Tidak ada pengembalian yang menunggu.</div>}
        </div>
      </Card>
    </div>
  );
}

/* =========================================================================
   ROLE ROOT APPS
   ========================================================================= */
function AdminApp({ me, isSuper }){
  const tabs = [
    { key:'overview', label:'Ringkasan', icon:'📊' },
    { key:'approve', label:'Persetujuan Stok', icon:'✅' },
    { key:'deliveries', label:'Pengantaran', icon:'🧊' },
    { key:'drivers', label:'Driver & Gudang', icon:'👥' },
    ...(isSuper ? [{ key:'admins', label:'Kelola Admin', icon:'🛡️' }] : []),
  ];
  const [active, setActive] = useState('overview');
  return (
    <Shell user={me} tabs={tabs} active={active} setActive={setActive} onLogout={()=>{ localStorage.removeItem('glasires_uid'); location.reload(); }}>
      {active==='overview' && <div className="fade-in"><h2 className="font-display font-bold text-xl text-glacier-900 mb-5">Ringkasan {isSuper?'(Super Admin)':''}</h2><StockOverview /><DeliveriesTable /></div>}
      {active==='approve' && <ApproveRequests me={me} />}
      {active==='deliveries' && <div className="fade-in"><StockOverview /><DeliveriesTable /></div>}
      {active==='drivers' && <ManageUsers me={me} allowedRoles={['driver','gudang']} title="Kelola Driver & Petugas Gudang" />}
      {active==='admins' && isSuper && <ManageUsers me={me} allowedRoles={['admin']} title="Kelola Akun Admin" />}
    </Shell>
  );
}

function ConfigErrorScreen({ reason }){
  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <Card className="max-w-lg fade-in">
        <div className="text-xs font-mono tracking-widest text-rose-500 mb-2">BELUM TERHUBUNG KE FIREBASE</div>
        <h1 className="font-display font-bold text-xl text-glacier-900 mb-3">
          {reason === 'PLACEHOLDER' ? 'Config Firebase belum diisi' : 'Gagal terhubung ke Firebase'}
        </h1>
        <p className="text-sm text-glacier-600 mb-4">
          {reason === 'PLACEHOLDER'
            ? 'Buka file HTML ini dengan editor teks (Notepad, VS Code, dsb), cari tulisan FIREBASE_CONFIG di bagian atas kode, lalu ganti semua nilai yang bertuliskan "GANTI_..." dengan config asli dari project Firebase kamu. Simpan file, lalu muat ulang halaman ini.'
            : 'Detail teknis: ' + reason}
        </p>
        <div className="text-sm font-semibold text-glacier-800 mb-2">Cara ambil config Firebase:</div>
        <ol className="text-sm text-glacier-700 list-decimal pl-5 space-y-1.5 mb-4">
          <li>Buka <span className="font-mono text-xs">console.firebase.google.com</span> → buat project baru (atau pakai yang sudah ada)</li>
          <li>Klik ⚙️ (Project Settings) → scroll ke "Your apps" → tambah app Web (ikon &lt;/&gt;) kalau belum ada → copy objek <span className="font-mono text-xs">firebaseConfig</span></li>
          <li>Di menu kiri, klik "Build" → "Realtime Database" → "Create Database" (bukan Firestore)</li>
          <li>Tempel config yang tadi dicopy ke <span className="font-mono text-xs">FIREBASE_CONFIG</span> di file ini, simpan, muat ulang halaman</li>
        </ol>
        <p className="text-xs text-glacier-400">Kalau sudah diganti tapi masih muncul pesan ini, cek lagi apakah ada tanda kutip atau koma yang salah ketik.</p>
      </Card>
    </div>
  );
}

/* =========================================================================
   ROOT
   ========================================================================= */
function App(){
  const [loading, setLoading] = useState(true);
  const [hasUsers, setHasUsers] = useState(true);
  const [me, setMe] = useState(null);

  useEffect(() => {
    (async () => {
      const snap = await db.ref('users').once('value');
      const usersExist = snap.exists();
      setHasUsers(usersExist);
      const uid = localStorage.getItem('glasires_uid');
      if (usersExist && uid) {
        const uSnap = await db.ref('users/' + uid).once('value');
        if (uSnap.exists() && uSnap.val().active !== false) setMe({ id: uid, ...uSnap.val() });
        else localStorage.removeItem('glasires_uid');
      }
      setLoading(false);
    })();
  }, []);

  if (loading) return <div className="min-h-screen flex items-center justify-center text-glacier-400 font-mono text-sm">Memuat…</div>;
  if (!hasUsers) return <SetupScreen onDone={()=>location.reload()} />;
  if (!me) return <LoginScreen onLogin={(u)=>setMe(u)} />;

  if (me.role === 'superadmin') return <AdminApp me={me} isSuper={true} />;
  if (me.role === 'admin') return <AdminApp me={me} isSuper={false} />;
  if (me.role === 'driver') return <DriverApp me={me} />;
  if (me.role === 'gudang') return <GudangApp me={me} />;
  return <div className="p-8">Peran tidak dikenal.</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  FIREBASE_INIT_ERROR ? <ConfigErrorScreen reason={FIREBASE_INIT_ERROR} /> : <App />
);
</script>
</body>
</html>
